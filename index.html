<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12263a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="KrimiLearn"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>KrimiLearn – Kriminalitätstheorien</title><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172a3b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#12263a;color:white;padding:24px 20px 19px}header h1{font-size:27px;margin:0}header p{margin:7px 0 0;color:#b9d0e0;font-size:14px}main{max-width:700px;margin:auto;padding:18px 16px 110px}.card{background:white;border-radius:18px;padding:21px;margin:0 0 15px;box-shadow:0 4px 18px #1020300c}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;color:#4d7087;text-transform:uppercase}h2{margin:8px 0 12px;font-size:23px}h3{margin:10px 0;font-size:18px}p{line-height:1.55}.muted{color:#637688;font-size:14px}.pill{display:inline-block;background:#e8f2f6;border-radius:999px;padding:6px 10px;color:#315f73;font-size:12px;font-weight:700;margin:3px 3px 3px 0}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:#126e80;color:white}button:disabled{opacity:.45;cursor:default}.secondary{background:#e8eff4;color:#17374b}.ghost{background:transparent;color:#126e80;border:1px solid #bfd2da}.choice{display:block;text-align:left;width:100%;background:#f3f7fa;color:#243d4e;border:2px solid transparent;margin:9px 0;font-weight:500}.choice.selected{border-color:#126e80;background:#e6f5f6}.choice.correct{border-color:#26966c;background:#e5f8ef}.choice.wrong{border-color:#c65c5c;background:#ffeded}.flex{display:flex;gap:9px;flex-wrap:wrap}.flex>*{flex:1}.progress{height:9px;background:#e3eaf0;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:#148d85}.big{font-size:36px;font-weight:800}.flash{min-height:225px;border:2px dashed #9eb9c5;border-radius:16px;padding:25px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;background:#f7fafb}.flash .answer{color:#17495b}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;border-top:1px solid #dbe5ec;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:2;box-shadow:0 -2px 15px #10203010}.tabs button{flex:1;background:transparent;color:#526879;padding:10px 4px;font-size:13px;border-radius:8px}.tabs button.active{background:#e6f3f5;color:#086979}.small{font-size:12px}.divider{border-top:1px solid #e5edf2;margin:17px 0}.feedback{border-left:4px solid #127e86;background:#eff8f9;padding:12px 15px;border-radius:8px;margin-top:15px}.warning{background:#fff5e8;border-left-color:#d99335}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.hidden{display:none!important}select{font:inherit;border:1px solid #c8d7e0;border-radius:10px;padding:12px;background:white;max-width:100%;width:100%}a{color:#126e80}footer{font-size:12px;color:#718394;text-align:center;padding:10px}
</style></head><body><header><h1>◈ KrimiLearn</h1><p>Kriminalitätstheorien verstehen · Prototyp 0.2</p></header><main id="app"></main><nav class="tabs" aria-label="Hauptnavigation"><button data-tab="home" class="active">⌂<br>Start</button><button data-tab="cards">▤<br>Lernkarten</button><button data-tab="quiz">✓<br>Wissenstest</button><button data-tab="stats">▥<br>Fortschritt</button></nav><script>
const theories=[
{id:'klassik',name:'Klassische Schule',authors:'Cesare Beccaria, Jeremy Bentham',core:'Menschen können wählen. Erwartete Nachteile sollen von Straftaten abschrecken.',mechanism:'Eine glaubwürdig erwartete Sanktion verändert die Entscheidung vor der Tat. Gewissheit, zeitliche Nähe, gesetzliche Bestimmtheit und Verhältnismäßigkeit sind zentral.',limits:'Historisch vereinfachtes Menschenbild; Emotionen und ungleiche Handlungsmöglichkeiten bleiben unterbelichtet.',example:'Eine Person beendet einen Streit, weil sie eine unmittelbare und vorhersehbare Sanktion erwartet.'},
{id:'rational',name:'Rational Choice',authors:'Gary S. Becker; Derek Cornish und Ronald Clarke',core:'Täter wägen subjektiv erwartete Vorteile, Aufwand und Risiken ab; Rationalität ist häufig begrenzt.',mechanism:'Wahrgenommene Kosten und Nutzen beeinflussen deliktspezifische Entscheidungen. Subjektive Einschätzungen können von objektiven Bedingungen abweichen.',limits:'Die Entstehung von Motiven wird nur begrenzt erklärt; tatsächliche Abwägungen sind schwer nachzuweisen.',example:'Eine Person unterlässt einen Diebstahl, weil sie anwesendes Personal als Entdeckungsrisiko wahrnimmt.'},
{id:'self',name:'Selbstkontrolltheorie',authors:'Michael Gottfredson und Travis Hirschi',core:'Geringe Selbstkontrolle begünstigt kurzfristig belohnendes, riskantes Verhalten; eine Gelegenheit muss hinzukommen.',mechanism:'Relativ stabile Neigung zur unmittelbaren Bedürfnisbefriedigung trifft auf Tatgelegenheiten. Frühe Beaufsichtigung und konsistente Reaktionen beeinflussen nach den Autoren ihre Entwicklung.',limits:'Gefahr zirkulärer Messung; geplante Delikte und Veränderungen der Selbstkontrolle sind problematisch.',example:'Bei einer Provokation setzt sich der kurzfristige Impuls durch, während mögliche Folgen kaum berücksichtigt werden.'},
{id:'strain',name:'General Strain Theory',authors:'Robert Agnew',core:'Belastungen können negative Gefühle und unter bestimmten Bedingungen kriminelle Bewältigung begünstigen.',mechanism:'Drei Belastungsformen: Zielverfehlung, Verlust positiver Reize und Konfrontation mit negativen Reizen. Emotionen, Coping, Unterstützung und Gelegenheiten vermitteln die Reaktion.',limits:'Belastung führt meist nicht zu Kriminalität; zusätzliche Bedingungen müssen präzisiert werden.',example:'Wiederholte Demütigungen lösen Wut aus; fehlende Unterstützung und ein vergeltungsbilligendes Umfeld können einen Angriff begünstigen.'}
];
const cards=[
['klassik','Welche beiden Personen stehen für die klassische Schule?','Cesare Beccaria und Jeremy Bentham.'],['klassik','Welcher Mechanismus soll Straftaten verhindern?','Abschreckung durch glaubwürdig erwartete Nachteile.'],['klassik','Welche Sanktionsmerkmale sind besonders bedeutsam?','Gewissheit und zeitliche Nähe; außerdem Bestimmtheit und Verhältnismäßigkeit.'],['klassik','Warum kann eine moderate Sanktion stärker abschrecken als eine seltene harte?','Weil ihre tatsächliche Anwendung glaubwürdiger erwartet wird.'],['klassik','Welche wichtige Grenze hat die klassische Schule?','Emotionen und ungleiche Handlungsmöglichkeiten werden wenig berücksichtigt.'],
['rational','Welche Größen werden bei Rational Choice abgewogen?','Subjektiv erwartete Vorteile, Aufwand und Risiken.'],['rational','Was bedeutet begrenzte Rationalität?','Entscheidungen erfolgen mit begrenzter Information und Wahrnehmung.'],['rational','Warum ist die subjektive Risikowahrnehmung wichtig?','Sie kann von der objektiven Entdeckungswahrscheinlichkeit abweichen.'],['rational','Was ist der Schwerpunkt von Cornish und Clarke?','Deliktspezifische Entscheidungen in konkreten Situationen.'],['rational','Welche zentrale Frage beantwortet Rational Choice nur begrenzt?','Wie die Motivation zur Tat ursprünglich entsteht.'],
['self','Welche Autoren formulierten die Selbstkontrolltheorie?','Michael Gottfredson und Travis Hirschi.'],['self','Welche zwei Bedingungen kommen im Ansatz zusammen?','Geringe Selbstkontrolle und eine Tatgelegenheit.'],['self','Welche Belohnungen stehen besonders im Vordergrund?','Unmittelbare, kurzfristige Bedürfnisbefriedigung.'],['self','Welche frühe Erziehung wird als relevant angesehen?','Beaufsichtigung, Erkennen von Fehlverhalten und konsistente Reaktionen.'],['self','Warum sollte Selbstkontrolle unabhängig von Delinquenz gemessen werden?','Sonst droht ein Zirkelschluss: Die Tat beweist die angenommene Ursache.'],
['strain','Wer entwickelte die General Strain Theory?','Robert Agnew.'],['strain','Welche drei Belastungsformen unterscheidet Agnew?','Zielverfehlung, Verlust positiver Reize und negative Behandlung.'],['strain','Welche Rolle spielen negative Emotionen?','Sie können Handlungsdruck erzeugen, bestimmen aber die Reaktion nicht allein.'],['strain','Was bedeutet Coping in der General Strain Theory?','Die Art, wie eine Person Belastungen bewältigt.'],['strain','Warum führt Belastung nicht zwangsläufig zu Kriminalität?','Unterstützung, Bewältigungsalternativen und Gelegenheiten beeinflussen die Reaktion.'],
['klassik','Fall: Warum kann eine rasche, vorhersehbare Reaktion auf Ladendiebstahl abschrecken?','Sie erhöht die glaubwürdig erwarteten Nachteile einer Tat.'],['rational','Fall: Ein Dieb unterschätzt eine Kamera. Welche Theorie passt?','Rational Choice: Entscheidend ist das subjektiv wahrgenommene Risiko.'],['self','Fall: Spontaner Diebstahl einer offen liegenden Sache – was wäre zu prüfen?','Impulsivität beziehungsweise geringe Selbstkontrolle und verfügbare Gelegenheit.'],['strain','Fall: Nach Demütigungen greift jemand an. Welche Zwischenschritte sind wichtig?','Negative Gefühle, Bewältigungsressourcen und ein vergeltungsbilligendes Umfeld.']
].map((x,i)=>({id:i+1,theory:x[0],front:x[1],back:x[2]}));
const quiz=[
{t:'klassik',q:'Was betont die klassische Schule besonders?',a:['Die Gewissheit und zeitliche Nähe von Sanktionen','Die biologische Vorbestimmung der Tat','Die Verteilung illegaler Gelegenheiten','Die Folgen sozialer Etikettierung'],c:0,e:'Beccaria betont glaubwürdig erwartete, bestimmte und verhältnismäßige Sanktionen.'},
{t:'klassik',q:'Warum ist eine selten vollzogene sehr harte Sanktion nicht zwingend abschreckender?',a:['Weil Sanktionen grundsätzlich wirkungslos sind','Weil ihre geringe Gewissheit die Erwartung eines Nachteils schwächt','Weil nur soziale Bindungen zählen','Weil die Täter immer vollständige Informationen haben'],c:1,e:'Im klassischen Argument ist die Gewissheit einer Sanktion besonders wichtig.'},
{t:'klassik',q:'Welcher Einwand trifft die klassische Schule?',a:['Sie setzt Tatgelegenheiten immer voraus','Sie berücksichtigt emotionale Dynamiken nur unzureichend','Sie untersucht ausschließlich Quartiere','Sie erklärt nur sekundäre Devianz'],c:1,e:'Das Modell vereinfacht menschliche Entscheidungen und Handlungsmöglichkeiten.'},
{t:'rational',q:'Was bedeutet „subjektiv“ bei Rational Choice?',a:['Nur der tatsächliche Gewinn zählt','Nur strafrechtliche Sanktionen zählen','Wahrgenommene Kosten und Vorteile können objektiv falsch eingeschätzt sein','Entscheidungen sind immer vollständig informiert'],c:2,e:'Subjektive Erwartungen steuern die Abwägung, nicht zwingend die objektiven Verhältnisse.'},
{t:'rational',q:'Eine Person lässt einen Diebstahl wegen anwesenden Personals bleiben. Was erklärt dies am direktesten?',a:['Verändertes wahrgenommenes Entdeckungsrisiko','Verlust positiver Reize','Sekundäre Devianz','Mangelnde gesellschaftliche Normregulierung'],c:0,e:'Das Personal verändert das subjektive Risiko der konkreten Tatentscheidung.'},
{t:'rational',q:'Welche Frage bleibt bei Rational Choice eher offen?',a:['Wie Risiken eingeschätzt werden','Warum überhaupt eine Tatmotivation entstanden ist','Ob Kosten subjektiv sein können','Ob Aufwand eine Rolle spielt'],c:1,e:'Rational Choice fokussiert auf die Entscheidung, nicht primär auf die Entstehung von Motiven.'},
{t:'self',q:'Was benötigt geringe Selbstkontrolle nach Gottfredson und Hirschi zusätzlich?',a:['Ein öffentliches Label','Eine geeignete Gelegenheit','Eine kollektive Normauflösung','Eine strafrechtliche Verurteilung'],c:1,e:'Neigung und Gelegenheit werden im Skript ausdrücklich miteinander verbunden.'},
{t:'self',q:'Welche Verhaltensweise passt am ehesten zur Selbstkontrolltheorie?',a:['Langfristig geplante Täuschung mit hohem Aufwand','Impulsives riskantes Handeln für eine sofortige Belohnung','Selektive polizeiliche Registrierung','Normkonflikt zwischen sozialen Gruppen'],c:1,e:'Die Theorie betont kurzfristige Belohnung und geringe Berücksichtigung späterer Folgen.'},
{t:'self',q:'Warum ist es problematisch, Selbstkontrolle allein durch begangene Straftaten zu messen?',a:['Wegen des ökologischen Fehlschlusses','Wegen einer möglichen zirkulären Erklärung','Wegen fehlender Normen','Wegen zu hoher Sanktionsgewissheit'],c:1,e:'Die Ursache darf nicht nur über das Verhalten definiert werden, das sie erklären soll.'},
{t:'strain',q:'Welche Belastung gehört zu Agnews General Strain Theory?',a:['Ausschließlich Einkommensarmut','Verlust positiv bewerteter Erfahrungen','Nur soziale Etikettierung','Nur räumliche Tatgelegenheiten'],c:1,e:'Agnew nennt auch Zielverfehlung und die Konfrontation mit negativen Reizen.'},
{t:'strain',q:'Warum führt eine Demütigung nicht automatisch zu Gewalt?',a:['Weil negative Emotionen nie relevant sind','Weil soziale Unterstützung und Coping den Umgang mit Belastung beeinflussen','Weil jede Sanktion abschreckt','Weil jede Entscheidung vollständig rational ist'],c:1,e:'Emotionen sind ein möglicher Vermittlungsschritt; weitere Bedingungen sind entscheidend.'},
{t:'strain',q:'Welche Beobachtung würde Agnews Erklärung eines Angriffs nach Demütigungen am besten prüfen?',a:['Ob die Person Wut erlebte und welche Bewältigungsalternativen verfügbar waren','Ob der Tatort ein Verkehrsknoten war','Ob die Person bereits etikettiert wurde','Ob die Sanktion gesetzlich bestimmt war'],c:0,e:'Agnew fragt nach Belastung, Emotionen, Unterstützung und Bewältigung.'},
{t:'klassik',q:'Welcher Ansatz begründet rechtspolitisch die Forderung nach bestimmten, verhältnismäßigen Sanktionen?',a:['General Strain Theory','Klassische Schule','Selbstkontrolltheorie','Rational Choice allein'],c:1,e:'Beccaria verknüpft Abschreckung mit Bestimmtheit und Verhältnismäßigkeit.'},
{t:'rational',q:'Eine Täterin hält das Risiko für gering, obwohl Kameras aktiv sind. Was ist für die Tatentscheidung relevant?',a:['Nur die tatsächliche Kameradichte','Ihre subjektive Risikoeinschätzung','Nur die Höhe der Höchststrafe','Ausschließlich die Kindheit'],c:1,e:'Rational Choice modelliert subjektiv wahrgenommene Kosten und Nutzen.'},
{t:'self',q:'Welche frühe Erfahrung gilt nach der Selbstkontrolltheorie als entwicklungsrelevant?',a:['Konsistente Reaktionen auf Fehlverhalten','Öffentliche Berichterstattung','Räumliche Konzentration von Tatorten','Kriminalisierung durch Medien'],c:0,e:'Frühe Beaufsichtigung und konsistente Reaktionen stehen im Mittelpunkt.'},
{t:'strain',q:'Ein Arbeitsplatzverlust führt zu Diebstahl. Welche Zusatzinformation ist für Agnew besonders wichtig?',a:['Ob finanzielle und emotionale Belastung sowie legale Bewältigungswege vorlagen','Ob die Sanktion in einem Gesetz steht','Ob die Person eine feste Pendelroute hat','Ob die Tat gefilmt wurde'],c:0,e:'Nicht der Verlust allein, sondern die Reaktion auf Belastung und vorhandene Alternativen ist wichtig.'}
];
const KEY='krimilearn-v01';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state.ratings ||= {};state.results ||= [];let tab='home',filter='all',cardIndex=0,revealed=false,session=null,cardMode='free',mcIndex=0,mcSelected=null,mcChecked=false;const app=document.getElementById('app');function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function theoryName(id){return theories.find(t=>t.id===id)?.name||id}function nav(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();scrollTo(0,0)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>nav(b.dataset.tab));function stat(){let vals=Object.values(state.ratings);return{known:vals.filter(x=>x==='known').length,review:vals.filter(x=>x==='review').length,total:cards.length}}function home(){let s=stat();return `<section class="card"><span class="eyebrow">Willkommen zurück</span><h2>Vier Theorien. Ein Lernziel: Verstehen.</h2><p>Arbeite die Lernkarten durch und prüfe dein Wissen mit Fragen zu Begriffen, Mechanismen und Fällen.</p><div class="flex"><button onclick="nav('cards')">Lernkarten öffnen</button><button class="secondary" onclick="nav('quiz')">Test starten</button></div></section><section class="card"><div class="row"><strong>Dein Lernstand</strong><span class="muted">${s.known} von ${s.total} sicher</span></div><div class="progress" style="margin:14px 0"><span style="width:${s.known/s.total*100}%"></span></div><p class="muted">${s.review} Karten zur Wiederholung markiert · ${state.results.length} abgeschlossene Tests</p></section><section class="card"><span class="eyebrow">Modul 1 · Person und Entscheidung</span><h3>Enthaltene Theorien</h3>${theories.map(t=>`<p><strong>${esc(t.name)}</strong><br><span class="muted">${esc(t.authors)}</span></p>`).join('')}<p class="muted">Grundlage: hochgeladenes Lernskript, Seiten 2–5. Ergänzende Fragen und Fälle wurden didaktisch formuliert.</p></section>`}function deck(){return cards.filter(c=>filter==='all'||(filter==='review' ? state.ratings[c.id]==='review':c.theory===filter))}function mcDeck(){return quiz.map((q,i)=>({...q,id:i})).filter(q=>filter==='all'||filter==='review'||q.t===filter)}
function setCardMode(mode){if(mode==='mc'&&filter==='review')filter='all';cardMode=mode;mcIndex=0;mcSelected=null;mcChecked=false;render()}
function mcPick(i){if(mcChecked)return;mcSelected=i;render()}
function mcCheck(){if(mcSelected===null)return;mcChecked=true;render()}
function mcNext(step){const d=mcDeck();if(!d.length)return;mcIndex=(mcIndex+step+d.length)%d.length;mcSelected=null;mcChecked=false;render()}
function mcCardsView(){const d=mcDeck();if(mcIndex>=d.length)mcIndex=0;const q=d[mcIndex];if(!q)return `<section class="card"><p>Keine Fragen vorhanden.</p></section>`;return `<section class="card"><div class="row"><span class="pill">${esc(theoryName(q.t))}</span><span class="muted">${mcIndex+1} / ${d.length}</span></div><div class="progress" style="margin:12px 0 20px"><span style="width:${(mcIndex+1)/d.length*100}%"></span></div><h2>${esc(q.q)}</h2><p class="muted">Wähle eine Antwort aus.</p>${q.a.map((a,i)=>`<button class="choice ${mcSelected===i?'selected':''} ${mcChecked&&i===q.c?'correct':''} ${mcChecked&&mcSelected===i&&i!==q.c?'wrong':''}" onclick="mcPick(${i})" ${mcChecked?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}${mcChecked?`<div class="feedback ${mcSelected===q.c?'':'warning'}"><strong>${mcSelected===q.c?'Richtig!':'Noch nicht richtig.'}</strong><p>${esc(q.e)}</p><p class="small">Richtige Antwort: ${esc(q.a[q.c])}</p></div><button style="width:100%;margin-top:14px" onclick="mcNext(1)">Nächste Frage →</button>`:`<button style="width:100%;margin-top:14px" onclick="mcCheck()" ${mcSelected===null?'disabled':''}>Antwort prüfen</button>`}<div class="flex" style="margin-top:10px"><button class="ghost" onclick="mcNext(-1)">← Vorherige</button><button class="ghost" onclick="mcNext(1)">Überspringen →</button></div></section>`}
function cardsView(){let d=deck();if(cardIndex>=d.length)cardIndex=0;let c=d[cardIndex];return `<section class="card"><span class="eyebrow">Lernkarten · ${d.length} Karten</span><h2>Wiederholen und verstehen</h2><div class="flex" style="margin:12px 0"><button class="${cardMode==='free'?'':'secondary'}" onclick="setCardMode('free')">Freie Antwort</button><button class="${cardMode==='mc'?'':'secondary'}" onclick="setCardMode('mc')">Multiple Choice</button></div><label class="muted" for="filter">Auswahl</label><select id="filter" onchange="setFilter(this.value)"><option value="all" ${filter==='all'?'selected':''}>Alle Theorien</option><option value="review" ${filter==='review'?'selected':''}>Nur unsichere Karten</option>${theories.map(t=>`<option value="${t.id}" ${filter===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></section>${cardMode==='mc'?mcCardsView():!c?`<section class="card"><h3>Keine Karten in dieser Auswahl</h3><p>Markiere Karten mit „Noch üben“, um sie hier gezielt zu wiederholen.</p><button onclick="setFilter('all')">Alle Karten anzeigen</button></section>`:`<section class="card"><div class="row"><span class="pill">${esc(theoryName(c.theory))}</span><span class="muted">${cardIndex+1} / ${d.length}</span></div><div class="progress" style="margin:12px 0 20px"><span style="width:${(cardIndex+1)/d.length*100}%"></span></div><div class="flash" onclick="flip()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flip()}"><span class="eyebrow">${revealed?'Antwort':'Frage'}</span><h3 class="${revealed?'answer':''}">${esc(revealed?c.back:c.front)}</h3><span class="muted small">${revealed?'Tippen, um die Frage erneut zu sehen':'Antippen, um die Antwort aufzudecken'}</span></div><div class="flex" style="margin-top:17px">${revealed?`<button class="secondary" onclick="rate('review')">↻ Noch üben</button><button onclick="rate('known')">✓ Gewusst</button>`:`<button class="secondary" onclick="nextCard(-1)">← Zurück</button><button onclick="flip()">Antwort zeigen</button>`}</div><div class="flex" style="margin-top:9px"><button class="ghost" onclick="nextCard(-1)">← Vorherige</button><button class="ghost" onclick="nextCard(1)">Nächste →</button></div></section>`}`}function setFilter(v){filter=v;cardIndex=0;mcIndex=0;mcSelected=null;mcChecked=false;revealed=false;if(v==='review'&&cardMode==='mc')cardMode='free';render()}function flip(){revealed=!revealed;render()}function nextCard(step){let d=deck();if(!d.length)return;cardIndex=(cardIndex+step+d.length)%d.length;revealed=false;render()}function rate(r){let c=deck()[cardIndex];if(!c)return;state.ratings[c.id]=r;save();nextCard(1)}function startQuiz(){let items=quiz.map((q,i)=>({...q,id:i}));for(let i=items.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}session={items:items.slice(0,10),pos:0,selected:null,checked:false,correct:0,answers:[]};render()}function pick(i){if(session.checked)return;session.selected=i;render()}function check(){if(session.selected===null)return;let q=session.items[session.pos];session.checked=true;if(session.selected===q.c)session.correct++;session.answers.push({id:q.id,correct:session.selected===q.c});render()}function advance(){if(session.pos===session.items.length-1){state.results.push({date:new Date().toISOString(),score:session.correct,total:session.items.length,answers:session.answers});save();session.done=true}else{session.pos++;session.selected=null;session.checked=false}render()}function quizView(){if(!session)return `<section class="card"><span class="eyebrow">Wissenstest</span><h2>Wie sicher sitzt dein Wissen?</h2><p>10 zufällig ausgewählte Fragen aus einem Pool von ${quiz.length} Aufgaben. Du erhältst nach jeder Antwort eine Erklärung.</p><p class="muted">Die Fragen enthalten Wissen, Verständnis und kurze Anwendungsfälle. Jede richtige Antwort zählt einen Punkt.</p><button onclick="startQuiz()">Test beginnen →</button></section>`;if(session.done)return `<section class="card"><span class="eyebrow">Test abgeschlossen</span><h2>Dein Ergebnis</h2><div class="big">${session.correct} / ${session.items.length}</div><p>${session.correct>=8?'Sehr gutes Ergebnis!':session.correct>=6?'Gute Grundlage – wiederhole noch einige Inhalte.':'Nutze die Lernkarten, um Wissenslücken gezielt zu schließen.'}</p><p class="muted">${Math.round(session.correct/session.items.length*100)} % richtig · Ergebnis lokal gespeichert</p><div class="flex"><button onclick="startQuiz()">Neuer Test</button><button class="secondary" onclick="nav('stats')">Auswertung</button></div></section>`;let q=session.items[session.pos];return `<section class="card"><div class="row"><span class="eyebrow">Frage ${session.pos+1} von ${session.items.length}</span><span class="pill">${esc(theoryName(q.t))}</span></div><div class="progress" style="margin:15px 0"><span style="width:${(session.pos+1)/session.items.length*100}%"></span></div><h2>${esc(q.q)}</h2>${q.a.map((a,i)=>`<button class="choice ${session.selected===i?'selected':''} ${session.checked&&i===q.c?'correct':''} ${session.checked&&session.selected===i&&i!==q.c?'wrong':''}" onclick="pick(${i})" ${session.checked?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}${session.checked?`<div class="feedback ${session.selected===q.c?'':'warning'}"><strong>${session.selected===q.c?'Richtig!':'Noch nicht richtig.'}</strong><p>${esc(q.e)}</p></div><button style="width:100%;margin-top:14px" onclick="advance()">${session.pos===session.items.length-1?'Ergebnis anzeigen':'Nächste Frage →'}</button>`:`<button style="width:100%;margin-top:14px" onclick="check()" ${session.selected===null?'disabled':''}>Antwort prüfen</button>`}</section>`}function statsView(){let s=stat(),last=state.results.slice(-5).reverse();return `<section class="card"><span class="eyebrow">Lernfortschritt</span><h2>Deine Übersicht</h2><div class="big">${s.known} <span class="muted" style="font-size:17px">/ ${s.total} Karten sicher</span></div><div class="progress" style="margin:14px 0"><span style="width:${s.known/s.total*100}%"></span></div><p>${s.review} Karten als unsicher markiert</p><div class="divider"></div>${theories.map(t=>{let d=cards.filter(c=>c.theory===t.id),k=d.filter(c=>state.ratings[c.id]==='known').length;return `<p><strong>${esc(t.name)}</strong> <span class="muted">${k}/${d.length}</span></p><div class="progress"><span style="width:${k/d.length*100}%"></span></div>`}).join('')}</section><section class="card"><h3>Letzte Tests</h3>${last.length?last.map(r=>`<p><strong>${r.score}/${r.total} Punkte</strong> <span class="muted">· ${new Date(r.date).toLocaleDateString('de-DE')}</span></p>`).join(''):'<p class="muted">Noch kein Test abgeschlossen.</p>'}<div class="divider"></div><p class="muted">Die Daten liegen ausschließlich im lokalen Speicher dieses Browsers. Bei Löschung der Websitedaten können sie verloren gehen.</p><div class="flex"><button class="secondary" onclick="exportData()">Fortschritt sichern</button><button class="ghost" onclick="importData()">Sicherung laden</button></div><input class="hidden" type="file" id="importFile" accept="application/json,.json" onchange="readImport(this)"><p><button class="ghost" onclick="resetData()">Lernstand zurücksetzen</button></p></section>`}function exportData(){let blob=new Blob([JSON.stringify({version:1,data:state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='krimilearn-lernstand.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(){document.getElementById('importFile').click()}function readImport(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);if(o.version!==1||!o.data||typeof o.data.ratings!=='object'||!Array.isArray(o.data.results))throw Error();if(confirm('Vorhandenen Lernstand durch diese Sicherung ersetzen?')){state={ratings:o.data.ratings,results:o.data.results};save();render()}}catch{alert('Diese Sicherungsdatei konnte nicht gelesen werden.')}};r.readAsText(f)}function resetData(){if(confirm('Alle Kartenbewertungen und Testergebnisse auf diesem Gerät löschen?')){state={ratings:{},results:[]};save();render()}}function render(){app.innerHTML=tab==='home'?home():tab==='cards'?cardsView():tab==='quiz'?quizView():statsView()}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script><footer>KrimiLearn 0.2 · Fachliche Grundlage: Lernskript Kriminalitätstheorien, S. 2–5</footer></body></html>
