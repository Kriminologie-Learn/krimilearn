theories.push(...[{"id":"skript5","name":"Kriminalanthropologie","authors":"Cesare Lombroso  ·  Mikro","core":"Lombroso deutete körperliche Merkmale als Ausdruck eines angeblichen evolutionären Rückfalls. Seine historische These steht für die Hinwendung zu Täteruntersuchungen und für die Folgen von voreingenommener Auswahl und Interpretation.","mechanism":"Lombroso deutete körperliche Merkmale als Ausdruck eines angeblichen evolutionären Rückfalls. Seine historische These steht für die Hinwendung zu Täteruntersuchungen und für die Folgen von voreingenommener Auswahl und Interpretation.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript6","name":"Persönlichkeitstheorie","authors":"Hans J. Eysenck  ·  Mikro","core":"Eysenck verbindet Persönlichkeitsdimensionen und Konditionierung. Unterschiede in der Reaktion auf Reize und Sanktionen sollen mitbestimmen, wie soziale Hemmungen erworben werden. Die Erklärung setzt damit bei Entwicklungs- und Lernprozessen an.","mechanism":"Eysenck verbindet Persönlichkeitsdimensionen und Konditionierung. Unterschiede in der Reaktion auf Reize und Sanktionen sollen mitbestimmen, wie soziale Hemmungen erworben werden. Die Erklärung setzt damit bei Entwicklungs- und Lernprozessen an.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript7","name":"Biosoziale Ansätze","authors":"Beispielsweise Adrian Raine  ·  Mikro in Wechselwirkung mit Meso und Makro","core":"Biosoziale Arbeiten untersuchen mögliche Wechselwirkungen etwa zwischen neuropsychologischer Entwicklung, Stressregulation und sozialem Umfeld. Ein beobachteter biologischer Zusammenhang kann auch Folgen sozialer Erfahrungen widerspiegeln.","mechanism":"Biosoziale Arbeiten untersuchen mögliche Wechselwirkungen etwa zwischen neuropsychologischer Entwicklung, Stressregulation und sozialem Umfeld. Ein beobachteter biologischer Zusammenhang kann auch Folgen sozialer Erfahrungen widerspiegeln.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript8","name":"Seductions of Crime","authors":"Jack Katz  ·  Mikro und Situation","core":"Katz rekonstruiert, wie eine Tat aus Sicht der handelnden Person im Moment eine besondere emotionale oder moralische Bedeutung gewinnt. Die situative Attraktivität reicht von als berechtigt erlebter Wut bis zur Spannung einer Grenzüberschreitung.","mechanism":"Katz rekonstruiert, wie eine Tat aus Sicht der handelnden Person im Moment eine besondere emotionale oder moralische Bedeutung gewinnt. Die situative Attraktivität reicht von als berechtigt erlebter Wut bis zur Spannung einer Grenzüberschreitung.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript9","name":"Differentielle Assoziation","authors":"Edwin H. Sutherland  ·  Mikro–Meso","core":"Sutherland unterscheidet das Lernen von Techniken und das Lernen von Definitionen, die Gesetzesverletzungen begünstigen oder ablehnen. Kontakte haben je nach Häufigkeit, Dauer, zeitlicher Priorität und Intensität unterschiedliches Gewicht.","mechanism":"Sutherland unterscheidet das Lernen von Techniken und das Lernen von Definitionen, die Gesetzesverletzungen begünstigen oder ablehnen. Kontakte haben je nach Häufigkeit, Dauer, zeitlicher Priorität und Intensität unterschiedliches Gewicht.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript10","name":"Theorie des sozialen Lernens","authors":"Robert Burgess und Ronald Akers  ·  Mikro–Meso","core":"Akers ergänzt Definitionen und Kontakte um Nachahmung und differentielle Verstärkung. Soziale und materielle Folgen beeinflussen, ob ein beobachtetes oder erstmals ausprobiertes Verhalten wiederholt wird.","mechanism":"Akers ergänzt Definitionen und Kontakte um Nachahmung und differentielle Verstärkung. Soziale und materielle Folgen beeinflussen, ob ein beobachtetes oder erstmals ausprobiertes Verhalten wiederholt wird.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript11","name":"Neutralisierungstechniken","authors":"Gresham Sykes und David Matza  ·  Mikro–Meso","core":"Sykes und Matza beschreiben fünf Rechtfertigungen, die eine Norm situativ außer Kraft setzen können. Dazu zählen Ablehnung von Verantwortung, Schaden oder Opfer, Verdammung der Verdammenden und Berufung auf höhere Loyalitäten.","mechanism":"Sykes und Matza beschreiben fünf Rechtfertigungen, die eine Norm situativ außer Kraft setzen können. Dazu zählen Ablehnung von Verantwortung, Schaden oder Opfer, Verdammung der Verdammenden und Berufung auf höhere Loyalitäten.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript12","name":"Drift Theorie","authors":"David Matza  ·  Mikro–Meso und Lebenslauf","core":"Matza beschreibt einen zeitweisen Zustand gelockerter Bindung an konventionelle Normen. Neutralisierungen können Handlungsspielräume öffnen. Ob in dieser Lage tatsächlich eine Straftat folgt, bleibt eine gesonderte Frage.","mechanism":"Matza beschreibt einen zeitweisen Zustand gelockerter Bindung an konventionelle Normen. Neutralisierungen können Handlungsspielräume öffnen. Ob in dieser Lage tatsächlich eine Straftat folgt, bleibt eine gesonderte Frage.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript13","name":"Soziale Bindungstheorie","authors":"Travis Hirschi  ·  Mikro–Meso","core":"Hirschi unterscheidet emotionale Bindung, Investitionen in konventionelle Ziele, Einbindung in konventionelle Aktivitäten und Glauben an die Geltung von Normen. Die Dimensionen bezeichnen unterschiedliche Mechanismen informeller Kontrolle.","mechanism":"Hirschi unterscheidet emotionale Bindung, Investitionen in konventionelle Ziele, Einbindung in konventionelle Aktivitäten und Glauben an die Geltung von Normen. Die Dimensionen bezeichnen unterschiedliche Mechanismen informeller Kontrolle.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript14","name":"Halt Theorie oder Containment Theorie","authors":"Walter C. Reckless  ·  Mikro–Meso","core":"Reckless unterscheidet innere und äußere Haltekräfte. Selbstbild und Frustrationstoleranz können ebenso abpuffern wie klare Erwartungen und verlässliche Bezugspersonen. Druck und Anziehung delinquenten Verhaltens wirken daneben weiter.","mechanism":"Reckless unterscheidet innere und äußere Haltekräfte. Selbstbild und Frustrationstoleranz können ebenso abpuffern wie klare Erwartungen und verlässliche Bezugspersonen. Druck und Anziehung delinquenten Verhaltens wirken daneben weiter.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript15","name":"Kontrollbalance Theorie","authors":"Charles R. Tittle  ·  Mikro–Meso mit Machtbezügen","core":"Tittle betrachtet das Verhältnis zwischen ausgeübter und erfahrener Kontrolle. Defizite und Überschüsse können unterschiedliche Formen von Devianz begünstigen. Ob sich das Ungleichgewicht in Verhalten übersetzt, hängt unter anderem von Gelegenheit und situativen Beschränkungen ab.","mechanism":"Tittle betrachtet das Verhältnis zwischen ausgeübter und erfahrener Kontrolle. Defizite und Überschüsse können unterschiedliche Formen von Devianz begünstigen. Ob sich das Ungleichgewicht in Verhalten übersetzt, hängt unter anderem von Gelegenheit und situativen Beschränkungen ab.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript16","name":"Subkulturtheorie","authors":"Albert K. Cohen  ·  Meso mit Makro–Mikro Verbindung","core":"Cohen erklärt delinquente Gruppenbildung über Statusfrustration. Jugendliche, die an dominanten Statusmaßstäben scheitern, können innerhalb einer Gruppe alternative Anerkennungskriterien entwickeln. Provokation und Normumkehr können darin einen eigenen Statuswert erhalten.","mechanism":"Cohen erklärt delinquente Gruppenbildung über Statusfrustration. Jugendliche, die an dominanten Statusmaßstäben scheitern, können innerhalb einer Gruppe alternative Anerkennungskriterien entwickeln. Provokation und Normumkehr können darin einen eigenen Statuswert erhalten.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript17","name":"Differentielle Gelegenheiten","authors":"Richard Cloward und Lloyd Ohlin  ·  Makro–Meso–Mikro","core":"Cloward und Ohlin ergänzen strukturell ungleiche legale Chancen um ungleichen Zugang zu illegalen Lern- und Erwerbsgelegenheiten. Kriminelle, konfliktorientierte und Rückzugssubkulturen stehen für idealtypische lokale Bedingungen.","mechanism":"Cloward und Ohlin ergänzen strukturell ungleiche legale Chancen um ungleichen Zugang zu illegalen Lern- und Erwerbsgelegenheiten. Kriminelle, konfliktorientierte und Rückzugssubkulturen stehen für idealtypische lokale Bedingungen.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript18","name":"Kulturkonflikttheorie","authors":"Thorsten Sellin  ·  Meso–Makro mit individuellen Folgen","core":"Sellin untersucht Konflikte zwischen Verhaltensnormen sozialer Gruppen und staatlich geltenden Normen. Ein Konflikt kann aus dem Aufeinandertreffen unterschiedlicher Normordnungen oder aus Differenzierung innerhalb einer Gesellschaft entstehen.","mechanism":"Sellin untersucht Konflikte zwischen Verhaltensnormen sozialer Gruppen und staatlich geltenden Normen. Ein Konflikt kann aus dem Aufeinandertreffen unterschiedlicher Normordnungen oder aus Differenzierung innerhalb einer Gesellschaft entstehen.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript19","name":"Code of the Street","authors":"Elijah Anderson  ·  Meso–Mikro mit Strukturbezug","core":"Anderson untersucht, wie in bestimmten marginalisierten urbanen Kontexten öffentlich gezeigter Respekt und die glaubhafte Bereitschaft zur Gegenwehr Schutz versprechen können. Personen können zwischen situativen Verhaltensregeln wechseln.","mechanism":"Anderson untersucht, wie in bestimmten marginalisierten urbanen Kontexten öffentlich gezeigter Respekt und die glaubhafte Bereitschaft zur Gegenwehr Schutz versprechen können. Personen können zwischen situativen Verhaltensregeln wechseln.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript20","name":"Soziale Desorganisation","authors":"Clifford Shaw und Henry McKay  ·  Meso; strukturelle Makrobezüge","core":"Shaw und McKay verbinden strukturelle Bedingungen wie Armut und häufige Fluktuation mit Schwierigkeiten, dauerhaft lokale Netzwerke und informelle Kontrolle aufzubauen. Zu erklären sind räumliche Unterschiede und ihre Stabilität trotz wechselnder Bewohner.","mechanism":"Shaw und McKay verbinden strukturelle Bedingungen wie Armut und häufige Fluktuation mit Schwierigkeiten, dauerhaft lokale Netzwerke und informelle Kontrolle aufzubauen. Zu erklären sind räumliche Unterschiede und ihre Stabilität trotz wechselnder Bewohner.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript21","name":"Kollektive Wirksamkeit","authors":"Robert Sampson, Stephen Raudenbush und Felton Earls  ·  Meso","core":"Sampson und Kollegen verbinden sozialen Zusammenhalt und Vertrauen mit geteilten Erwartungen, bei Problemen zum Wohl der Gemeinschaft einzugreifen. Eingreifen kann auch in koordinierter Hilfe oder Ansprache zuständiger Stellen bestehen.","mechanism":"Sampson und Kollegen verbinden sozialen Zusammenhalt und Vertrauen mit geteilten Erwartungen, bei Problemen zum Wohl der Gemeinschaft einzugreifen. Eingreifen kann auch in koordinierter Hilfe oder Ansprache zuständiger Stellen bestehen.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript22","name":"Broken Windows Ansatz","authors":"James Q. Wilson und George L. Kelling  ·  Meso mit Mikroprozessen","core":"Der Ansatz vermutet eine Kette von sichtbarer Unordnung über Rückzug und schwächere informelle Kontrolle hin zu schwereren Delikten. Die einzelnen Pfeile sind empirische Behauptungen und müssen getrennt geprüft werden.","mechanism":"Der Ansatz vermutet eine Kette von sichtbarer Unordnung über Rückzug und schwächere informelle Kontrolle hin zu schwereren Delikten. Die einzelnen Pfeile sind empirische Behauptungen und müssen getrennt geprüft werden.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript23","name":"Anomie bei Durkheim","authors":"Émile Durkheim  ·  Makro","core":"Durkheim beschreibt Anomie als Schwächung sozialer Regulierung, etwa bei raschem wirtschaftlichem oder sozialem Wandel. Die Normalität von Kriminalität ist eine weitere These. Normverletzungen kommen in Gesellschaften regelmäßig vor und können Grenzziehungen sichtbar machen.","mechanism":"Durkheim beschreibt Anomie als Schwächung sozialer Regulierung, etwa bei raschem wirtschaftlichem oder sozialem Wandel. Die Normalität von Kriminalität ist eine weitere These. Normverletzungen kommen in Gesellschaften regelmäßig vor und können Grenzziehungen sichtbar machen.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript24","name":"Anomie oder Strain Theorie bei Merton","authors":"Robert K. Merton  ·  Makro mit individuellen Anpassungsformen","core":"Merton unterscheidet kulturell stark betonte Ziele und institutionell gebilligte Mittel. Ungleicher Zugang zu den Mitteln begünstigt verschiedene Anpassungen. Konformität akzeptiert beides, Innovation behält Ziele bei, Ritualismus hält an Mitteln fest, Rückzug verwirft beides und Rebellion strebt Ersatz an.","mechanism":"Merton unterscheidet kulturell stark betonte Ziele und institutionell gebilligte Mittel. Ungleicher Zugang zu den Mitteln begünstigt verschiedene Anpassungen. Konformität akzeptiert beides, Innovation behält Ziele bei, Ritualismus hält an Mitteln fest, Rückzug verwirft beides und Rebellion strebt Ersatz an.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript25","name":"Institutionelle Anomietheorie","authors":"Steven Messner und Richard Rosenfeld  ·  Makro","core":"Messner und Rosenfeld verbinden eine Kultur des Erfolgsstrebens mit institutionellem Ungleichgewicht. Ökonomische Dominanz kann sich in Abwertung, Anpassung und Durchdringung nichtökonomischer Institutionen zeigen. Die Erklärung richtet sich auf gesellschaftliche Kriminalitätsmuster.","mechanism":"Messner und Rosenfeld verbinden eine Kultur des Erfolgsstrebens mit institutionellem Ungleichgewicht. Ökonomische Dominanz kann sich in Abwertung, Anpassung und Durchdringung nichtökonomischer Institutionen zeigen. Die Erklärung richtet sich auf gesellschaftliche Kriminalitätsmuster.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript26","name":"Konflikt und marxistische Ansätze","authors":"Unter anderem Willem Bonger, Richard Quinney und William Chambliss  ·  Makro mit Bezügen zu weiteren Ebenen","core":"Unter anderem Willem Bonger, Richard Quinney und William Chambliss  ·  Makro mit Bezügen zu weiteren Ebenen Die Ansätze teilen das Interesse an Macht und ungleichen Ressourcen. Bonger betont ökonomische Bedingungen, während konfliktorientierte Arbeiten auch fragen, welche Interessen in Gesetzgebung und Kontrolle durchgesetzt werden.","mechanism":"Unter anderem Willem Bonger, Richard Quinney und William Chambliss  ·  Makro mit Bezügen zu weiteren Ebenen Die Ansätze teilen das Interesse an Macht und ungleichen Ressourcen. Bonger betont ökonomische Bedingungen, während konfliktorientierte Arbeiten auch fragen, welche Interessen in Gesetzgebung und Kontrolle durchgesetzt werden.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript27","name":"Radikaler Labeling Ansatz","authors":"Fritz Sack  ·  Makro–Meso","core":"Sack rückt Kriminalität als Ergebnis gesellschaftlicher Zuschreibung und selektiver Kontrolle in den Vordergrund. Die Verteilung offizieller Kriminalität muss deshalb als Ergebnis institutioneller Auswahlprozesse analysiert werden.","mechanism":"Sack rückt Kriminalität als Ergebnis gesellschaftlicher Zuschreibung und selektiver Kontrolle in den Vordergrund. Die Verteilung offizieller Kriminalität muss deshalb als Ergebnis institutioneller Auswahlprozesse analysiert werden.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript28","name":"Routine Activity Approach","authors":"Lawrence E. Cohen und Marcus Felson  ·  Situation; Verbindung von Mikro und Makro","core":"Cohen und Felson erklären Deliktereignisse über das zeitliche und räumliche Zusammentreffen eines motivierten Täters, eines geeigneten Ziels und fehlender wirksamer Aufsicht. Alltagsroutinen verändern die Häufigkeit dieser Konstellationen.","mechanism":"Cohen und Felson erklären Deliktereignisse über das zeitliche und räumliche Zusammentreffen eines motivierten Täters, eines geeigneten Ziels und fehlender wirksamer Aufsicht. Alltagsroutinen verändern die Häufigkeit dieser Konstellationen.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript29","name":"Crime Pattern Theory","authors":"Patricia und Paul Brantingham  ·  Situation und Meso","core":"Die Brantinghams verknüpfen Tatorte mit alltäglichen Wegen, Anlaufpunkten und den dadurch bekannten Räumen. Übergänge und Orte mit vielen Aktivitäten können Gelegenheiten räumlich bündeln.","mechanism":"Die Brantinghams verknüpfen Tatorte mit alltäglichen Wegen, Anlaufpunkten und den dadurch bekannten Räumen. Übergänge und Orte mit vielen Aktivitäten können Gelegenheiten räumlich bündeln.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript30","name":"Situational Action Theory oder SAT","authors":"Per-Olof H. Wikström  ·  Verbindet Mikro, Meso und Makro","core":"Wikström erklärt Taten über einen Wahrnehmungs- und Entscheidungsprozess. Persönliche Moral und wahrgenommene Regeln des Settings beeinflussen, welche Handlungen überhaupt als Alternativen erscheinen. Bei einer Abwägung können Selbstkontrolle und Abschreckung relevant werden.","mechanism":"Wikström erklärt Taten über einen Wahrnehmungs- und Entscheidungsprozess. Persönliche Moral und wahrgenommene Regeln des Settings beeinflussen, welche Handlungen überhaupt als Alternativen erscheinen. Bei einer Abwägung können Selbstkontrolle und Abschreckung relevant werden.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript31","name":"Labeling oder Etikettierung","authors":"Frank Tannenbaum, Edwin Lemert, Howard S. Becker  ·  Mikro–Makro","core":"Tannenbaum, Lemert und Becker setzen unterschiedliche Akzente. Gemeinsam ist der Blick auf Regeln, ihre Anwendung und die Folgen sozialer Reaktionen. Becker fragt auch danach, wer Regeln durchsetzt und wer als Außenseiter gilt.","mechanism":"Tannenbaum, Lemert und Becker setzen unterschiedliche Akzente. Gemeinsam ist der Blick auf Regeln, ihre Anwendung und die Folgen sozialer Reaktionen. Becker fragt auch danach, wer Regeln durchsetzt und wer als Außenseiter gilt.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript32","name":"Primäre und sekundäre Devianz","authors":"Edwin Lemert  ·  Mikro–Meso","core":"Lemert trennt anfängliche Normverletzungen mit unterschiedlichen Ursachen von sekundärer Devianz als möglicher Reaktion auf soziale Folgen der Etikettierung. Eine veränderte Rolle und eingeschränkte konventionelle Möglichkeiten sind mögliche Zwischenschritte.","mechanism":"Lemert trennt anfängliche Normverletzungen mit unterschiedlichen Ursachen von sekundärer Devianz als möglicher Reaktion auf soziale Folgen der Etikettierung. Eine veränderte Rolle und eingeschränkte konventionelle Möglichkeiten sind mögliche Zwischenschritte.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript33","name":"Reintegrative Shaming","authors":"John Braithwaite  ·  Mikro–Makro","core":"Braithwaite unterscheidet Reaktionen, die Missbilligung der Handlung mit Wiederaufnahme in eine Gemeinschaft verbinden, von dauerhaft ausgrenzenden Reaktionen. Soziale Beziehungen geben der Missbilligung Gewicht und ermöglichen Rückkehr.","mechanism":"Braithwaite unterscheidet Reaktionen, die Missbilligung der Handlung mit Wiederaufnahme in eine Gemeinschaft verbinden, von dauerhaft ausgrenzenden Reaktionen. Soziale Beziehungen geben der Missbilligung Gewicht und ermöglichen Rückkehr.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript34","name":"Defiance Theory","authors":"Lawrence W. Sherman  ·  Mikro–Meso","core":"Sherman beschreibt Trotz als mögliche Reaktion auf als unfair wahrgenommene Sanktion. Schwache Bindung an die sanktionierende Instanz und eine als stigmatisierend empfundene Behandlung können die Reaktion begünstigen.","mechanism":"Sherman beschreibt Trotz als mögliche Reaktion auf als unfair wahrgenommene Sanktion. Schwache Bindung an die sanktionierende Instanz und eine als stigmatisierend empfundene Behandlung können die Reaktion begünstigen.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript35","name":"Age Graded Theory","authors":"Robert Sampson und John Laub  ·  Mikro–Meso","core":"Sampson und Laub untersuchen, wie altersabhängige informelle Bindungen im Lebensverlauf wirken. Stabile Arbeit oder tragfähige Beziehungen können Routinen, Aufsicht und Zukunftsinvestitionen verändern. Ein Lebensereignis wird durch seine Folgen für die tatsächliche Lebensführung zum Wendepunkt.","mechanism":"Sampson und Laub untersuchen, wie altersabhängige informelle Bindungen im Lebensverlauf wirken. Stabile Arbeit oder tragfähige Beziehungen können Routinen, Aufsicht und Zukunftsinvestitionen verändern. Ein Lebensereignis wird durch seine Folgen für die tatsächliche Lebensführung zum Wendepunkt.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript36","name":"Entwicklungstaxonomie oder Two Path Theory","authors":"Terrie E. Moffitt  ·  Mikro–Meso","core":"Moffitt unterscheidet idealtypisch einen früh beginnenden, über Lebensphasen anhaltenden Verlauf und einen vorwiegend auf die Jugend begrenzten Verlauf. Für ersteren sind Wechselwirkungen individueller Entwicklungsrisiken und belastender Umwelten zentral. Beim zweiten spielt die Lücke zwischen biologischer und sozialer Reife eine Rolle.","mechanism":"Moffitt unterscheidet idealtypisch einen früh beginnenden, über Lebensphasen anhaltenden Verlauf und einen vorwiegend auf die Jugend begrenzten Verlauf. Für ersteren sind Wechselwirkungen individueller Entwicklungsrisiken und belastender Umwelten zentral. Beim zweiten spielt die Lücke zwischen biologischer und sozialer Reife eine Rolle.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript37","name":"Interactional Theory","authors":"Terence P. Thornberry  ·  Mikro–Meso","core":"Thornberry betrachtet Bindungen, Peers, Überzeugungen und Delinquenz als wechselseitig verbunden. Schwache Bindungen können Delinquenz fördern. Delinquenz kann ihrerseits Bindungen schwächen und Zugang zu delinquenten Gruppen verändern.","mechanism":"Thornberry betrachtet Bindungen, Peers, Überzeugungen und Delinquenz als wechselseitig verbunden. Schwache Bindungen können Delinquenz fördern. Delinquenz kann ihrerseits Bindungen schwächen und Zugang zu delinquenten Gruppen verändern.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript38","name":"Karrieremodelle","authors":"Stephan Quensel; Henner Hess  ·  Mikro–Makro","core":"Prozessmodelle betrachten wiederholte Delinquenz als Verlauf, in dem Verhalten, Sanktion, soziale Reaktionen und Gelegenheiten aufeinander folgen können. Quensels und Hess’ Modelle setzen jeweils eigene Akzente bei der Verbindung von Handeln und gesellschaftlicher Reaktion.","mechanism":"Prozessmodelle betrachten wiederholte Delinquenz als Verlauf, in dem Verhalten, Sanktion, soziale Reaktionen und Gelegenheiten aufeinander folgen können. Quensels und Hess’ Modelle setzen jeweils eigene Akzente bei der Verbindung von Handeln und gesellschaftlicher Reaktion.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript39","name":"Feministische Kriminologien","authors":"Unter anderem Frances Heidensohn, Carol Smart, Meda Chesney-Lind  ·  Mehrere Ebenen","core":"Feministische Kriminologien untersuchen geschlechtlich strukturierte Macht, Kriminalisierung, Viktimisierung und institutionelle Reaktionen. Unterschiedliche Strömungen betonen etwa Arbeitsteilung, Gewaltverhältnisse oder das Zusammenwirken von Geschlecht mit weiteren Ungleichheiten.","mechanism":"Feministische Kriminologien untersuchen geschlechtlich strukturierte Macht, Kriminalisierung, Viktimisierung und institutionelle Reaktionen. Unterschiedliche Strömungen betonen etwa Arbeitsteilung, Gewaltverhältnisse oder das Zusammenwirken von Geschlecht mit weiteren Ungleichheiten.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript40","name":"Power Control Theorie","authors":"John Hagan und Mitarbeitende  ·  Makro–Meso–Mikro","core":"Hagan und Kollegen verbinden Machtverhältnisse im Erwerbsleben mit geschlechtsspezifischer Kontrolle im Haushalt. Unterschiede in Beaufsichtigung und Freiräumen können Unterschiede in Risikoneigung und Delinquenz mit erklären.","mechanism":"Hagan und Kollegen verbinden Machtverhältnisse im Erwerbsleben mit geschlechtsspezifischer Kontrolle im Haushalt. Unterschiede in Beaufsichtigung und Freiräumen können Unterschiede in Risikoneigung und Delinquenz mit erklären.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript41","name":"Cultural Criminology","authors":"Jeff Ferrell, Keith Hayward, Jock Young  ·  Mikro–Makro","core":"Cultural Criminology untersucht Bedeutungen von Kriminalität und Kontrolle, etwa Stil, Emotionen, Medienbilder und kulturelle Aushandlung. Sie verbindet das Erleben in Situationen mit öffentlicher Darstellung.","mechanism":"Cultural Criminology untersucht Bedeutungen von Kriminalität und Kontrolle, etwa Stil, Emotionen, Medienbilder und kulturelle Aushandlung. Sie verbindet das Erleben in Situationen mit öffentlicher Darstellung.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript42","name":"Mikrosoziologie der Gewalt","authors":"Randall Collins  ·  Mikro und Situation","core":"Collins rückt die Dynamik der direkten Konfrontation in den Mittelpunkt. Angst und Anspannung können gewaltbereite Personen hemmen. Die emotionale Dominanz einer Seite und die Dynamik einer Gruppe können die Situation verändern. Vorwärtspanik bezeichnet bei Collins eine besondere Eskalation nach aufgestauter Spannung.","mechanism":"Collins rückt die Dynamik der direkten Konfrontation in den Mittelpunkt. Angst und Anspannung können gewaltbereite Personen hemmen. Die emotionale Dominanz einer Seite und die Dynamik einer Gruppe können die Situation verändern. Vorwärtspanik bezeichnet bei Collins eine besondere Eskalation nach aufgestauter Spannung.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."},{"id":"skript43","name":"Theorie der sozialen Identität","authors":"Henri Tajfel und John Turner  ·  Mikro–Meso","core":"Kategorisierung und Identifikation machen die eigene Gruppe zu einem Teil des Selbstbilds. Der Vergleich mit relevanten Fremdgruppen kann das Bedürfnis nach positiver Abgrenzung verstärken. Welche Handlung daraus folgt, hängt von der Gruppennorm und der Situation ab.","mechanism":"Kategorisierung und Identifikation machen die eigene Gruppe zu einem Teil des Selbstbilds. Der Vergleich mit relevanten Fremdgruppen kann das Bedürfnis nach positiver Abgrenzung verstärken. Welche Handlung daraus folgt, hängt von der Gruppennorm und der Situation ab.","limits":"Vertiefung und kritische Einordnung anhand des Lernskripts.","example":"Übertrage den dargestellten Erklärungsmechanismus auf einen konkreten Fall."}]);
cards.push(...[["skript5","Welcher Erklärungsansatz steht im Mittelpunkt von „Kriminalanthropologie“?","Lombroso deutete körperliche Merkmale als Ausdruck eines angeblichen evolutionären Rückfalls. Seine historische These steht für die Hinwendung zu Täteruntersuchungen und für die Folgen von voreingenommener Auswahl und Interpretation."],["skript5","Welche Vertreter bzw. Einordnung nennt das Skript für „Kriminalanthropologie“?","Cesare Lombroso  ·  Mikro"],["skript5","Erläutere den Mechanismus von „Kriminalanthropologie“ in eigenen Worten.","Lombroso deutete körperliche Merkmale als Ausdruck eines angeblichen evolutionären Rückfalls. Seine historische These steht für die Hinwendung zu Täteruntersuchungen und für die Folgen von voreingenommener Auswahl und Interpretation."],["skript6","Welcher Erklärungsansatz steht im Mittelpunkt von „Persönlichkeitstheorie“?","Eysenck verbindet Persönlichkeitsdimensionen und Konditionierung. Unterschiede in der Reaktion auf Reize und Sanktionen sollen mitbestimmen, wie soziale Hemmungen erworben werden. Die Erklärung setzt damit bei Entwicklungs- und Lernprozessen an."],["skript6","Welche Vertreter bzw. Einordnung nennt das Skript für „Persönlichkeitstheorie“?","Hans J. Eysenck  ·  Mikro"],["skript6","Erläutere den Mechanismus von „Persönlichkeitstheorie“ in eigenen Worten.","Eysenck verbindet Persönlichkeitsdimensionen und Konditionierung. Unterschiede in der Reaktion auf Reize und Sanktionen sollen mitbestimmen, wie soziale Hemmungen erworben werden. Die Erklärung setzt damit bei Entwicklungs- und Lernprozessen an."],["skript7","Welcher Erklärungsansatz steht im Mittelpunkt von „Biosoziale Ansätze“?","Biosoziale Arbeiten untersuchen mögliche Wechselwirkungen etwa zwischen neuropsychologischer Entwicklung, Stressregulation und sozialem Umfeld. Ein beobachteter biologischer Zusammenhang kann auch Folgen sozialer Erfahrungen widerspiegeln."],["skript7","Welche Vertreter bzw. Einordnung nennt das Skript für „Biosoziale Ansätze“?","Beispielsweise Adrian Raine  ·  Mikro in Wechselwirkung mit Meso und Makro"],["skript7","Erläutere den Mechanismus von „Biosoziale Ansätze“ in eigenen Worten.","Biosoziale Arbeiten untersuchen mögliche Wechselwirkungen etwa zwischen neuropsychologischer Entwicklung, Stressregulation und sozialem Umfeld. Ein beobachteter biologischer Zusammenhang kann auch Folgen sozialer Erfahrungen widerspiegeln."],["skript8","Welcher Erklärungsansatz steht im Mittelpunkt von „Seductions of Crime“?","Katz rekonstruiert, wie eine Tat aus Sicht der handelnden Person im Moment eine besondere emotionale oder moralische Bedeutung gewinnt. Die situative Attraktivität reicht von als berechtigt erlebter Wut bis zur Spannung einer Grenzüberschreitung."],["skript8","Welche Vertreter bzw. Einordnung nennt das Skript für „Seductions of Crime“?","Jack Katz  ·  Mikro und Situation"],["skript8","Erläutere den Mechanismus von „Seductions of Crime“ in eigenen Worten.","Katz rekonstruiert, wie eine Tat aus Sicht der handelnden Person im Moment eine besondere emotionale oder moralische Bedeutung gewinnt. Die situative Attraktivität reicht von als berechtigt erlebter Wut bis zur Spannung einer Grenzüberschreitung."],["skript9","Welcher Erklärungsansatz steht im Mittelpunkt von „Differentielle Assoziation“?","Sutherland unterscheidet das Lernen von Techniken und das Lernen von Definitionen, die Gesetzesverletzungen begünstigen oder ablehnen. Kontakte haben je nach Häufigkeit, Dauer, zeitlicher Priorität und Intensität unterschiedliches Gewicht."],["skript9","Welche Vertreter bzw. Einordnung nennt das Skript für „Differentielle Assoziation“?","Edwin H. Sutherland  ·  Mikro–Meso"],["skript9","Erläutere den Mechanismus von „Differentielle Assoziation“ in eigenen Worten.","Sutherland unterscheidet das Lernen von Techniken und das Lernen von Definitionen, die Gesetzesverletzungen begünstigen oder ablehnen. Kontakte haben je nach Häufigkeit, Dauer, zeitlicher Priorität und Intensität unterschiedliches Gewicht."],["skript10","Welcher Erklärungsansatz steht im Mittelpunkt von „Theorie des sozialen Lernens“?","Akers ergänzt Definitionen und Kontakte um Nachahmung und differentielle Verstärkung. Soziale und materielle Folgen beeinflussen, ob ein beobachtetes oder erstmals ausprobiertes Verhalten wiederholt wird."],["skript10","Welche Vertreter bzw. Einordnung nennt das Skript für „Theorie des sozialen Lernens“?","Robert Burgess und Ronald Akers  ·  Mikro–Meso"],["skript10","Erläutere den Mechanismus von „Theorie des sozialen Lernens“ in eigenen Worten.","Akers ergänzt Definitionen und Kontakte um Nachahmung und differentielle Verstärkung. Soziale und materielle Folgen beeinflussen, ob ein beobachtetes oder erstmals ausprobiertes Verhalten wiederholt wird."],["skript11","Welcher Erklärungsansatz steht im Mittelpunkt von „Neutralisierungstechniken“?","Sykes und Matza beschreiben fünf Rechtfertigungen, die eine Norm situativ außer Kraft setzen können. Dazu zählen Ablehnung von Verantwortung, Schaden oder Opfer, Verdammung der Verdammenden und Berufung auf höhere Loyalitäten."],["skript11","Welche Vertreter bzw. Einordnung nennt das Skript für „Neutralisierungstechniken“?","Gresham Sykes und David Matza  ·  Mikro–Meso"],["skript11","Erläutere den Mechanismus von „Neutralisierungstechniken“ in eigenen Worten.","Sykes und Matza beschreiben fünf Rechtfertigungen, die eine Norm situativ außer Kraft setzen können. Dazu zählen Ablehnung von Verantwortung, Schaden oder Opfer, Verdammung der Verdammenden und Berufung auf höhere Loyalitäten."],["skript12","Welcher Erklärungsansatz steht im Mittelpunkt von „Drift Theorie“?","Matza beschreibt einen zeitweisen Zustand gelockerter Bindung an konventionelle Normen. Neutralisierungen können Handlungsspielräume öffnen. Ob in dieser Lage tatsächlich eine Straftat folgt, bleibt eine gesonderte Frage."],["skript12","Welche Vertreter bzw. Einordnung nennt das Skript für „Drift Theorie“?","David Matza  ·  Mikro–Meso und Lebenslauf"],["skript12","Erläutere den Mechanismus von „Drift Theorie“ in eigenen Worten.","Matza beschreibt einen zeitweisen Zustand gelockerter Bindung an konventionelle Normen. Neutralisierungen können Handlungsspielräume öffnen. Ob in dieser Lage tatsächlich eine Straftat folgt, bleibt eine gesonderte Frage."],["skript13","Welcher Erklärungsansatz steht im Mittelpunkt von „Soziale Bindungstheorie“?","Hirschi unterscheidet emotionale Bindung, Investitionen in konventionelle Ziele, Einbindung in konventionelle Aktivitäten und Glauben an die Geltung von Normen. Die Dimensionen bezeichnen unterschiedliche Mechanismen informeller Kontrolle."],["skript13","Welche Vertreter bzw. Einordnung nennt das Skript für „Soziale Bindungstheorie“?","Travis Hirschi  ·  Mikro–Meso"],["skript13","Erläutere den Mechanismus von „Soziale Bindungstheorie“ in eigenen Worten.","Hirschi unterscheidet emotionale Bindung, Investitionen in konventionelle Ziele, Einbindung in konventionelle Aktivitäten und Glauben an die Geltung von Normen. Die Dimensionen bezeichnen unterschiedliche Mechanismen informeller Kontrolle."],["skript14","Welcher Erklärungsansatz steht im Mittelpunkt von „Halt Theorie oder Containment Theorie“?","Reckless unterscheidet innere und äußere Haltekräfte. Selbstbild und Frustrationstoleranz können ebenso abpuffern wie klare Erwartungen und verlässliche Bezugspersonen. Druck und Anziehung delinquenten Verhaltens wirken daneben weiter."],["skript14","Welche Vertreter bzw. Einordnung nennt das Skript für „Halt Theorie oder Containment Theorie“?","Walter C. Reckless  ·  Mikro–Meso"],["skript14","Erläutere den Mechanismus von „Halt Theorie oder Containment Theorie“ in eigenen Worten.","Reckless unterscheidet innere und äußere Haltekräfte. Selbstbild und Frustrationstoleranz können ebenso abpuffern wie klare Erwartungen und verlässliche Bezugspersonen. Druck und Anziehung delinquenten Verhaltens wirken daneben weiter."],["skript15","Welcher Erklärungsansatz steht im Mittelpunkt von „Kontrollbalance Theorie“?","Tittle betrachtet das Verhältnis zwischen ausgeübter und erfahrener Kontrolle. Defizite und Überschüsse können unterschiedliche Formen von Devianz begünstigen. Ob sich das Ungleichgewicht in Verhalten übersetzt, hängt unter anderem von Gelegenheit und situativen Beschränkungen ab."],["skript15","Welche Vertreter bzw. Einordnung nennt das Skript für „Kontrollbalance Theorie“?","Charles R. Tittle  ·  Mikro–Meso mit Machtbezügen"],["skript15","Erläutere den Mechanismus von „Kontrollbalance Theorie“ in eigenen Worten.","Tittle betrachtet das Verhältnis zwischen ausgeübter und erfahrener Kontrolle. Defizite und Überschüsse können unterschiedliche Formen von Devianz begünstigen. Ob sich das Ungleichgewicht in Verhalten übersetzt, hängt unter anderem von Gelegenheit und situativen Beschränkungen ab."],["skript16","Welcher Erklärungsansatz steht im Mittelpunkt von „Subkulturtheorie“?","Cohen erklärt delinquente Gruppenbildung über Statusfrustration. Jugendliche, die an dominanten Statusmaßstäben scheitern, können innerhalb einer Gruppe alternative Anerkennungskriterien entwickeln. Provokation und Normumkehr können darin einen eigenen Statuswert erhalten."],["skript16","Welche Vertreter bzw. Einordnung nennt das Skript für „Subkulturtheorie“?","Albert K. Cohen  ·  Meso mit Makro–Mikro Verbindung"],["skript16","Erläutere den Mechanismus von „Subkulturtheorie“ in eigenen Worten.","Cohen erklärt delinquente Gruppenbildung über Statusfrustration. Jugendliche, die an dominanten Statusmaßstäben scheitern, können innerhalb einer Gruppe alternative Anerkennungskriterien entwickeln. Provokation und Normumkehr können darin einen eigenen Statuswert erhalten."],["skript17","Welcher Erklärungsansatz steht im Mittelpunkt von „Differentielle Gelegenheiten“?","Cloward und Ohlin ergänzen strukturell ungleiche legale Chancen um ungleichen Zugang zu illegalen Lern- und Erwerbsgelegenheiten. Kriminelle, konfliktorientierte und Rückzugssubkulturen stehen für idealtypische lokale Bedingungen."],["skript17","Welche Vertreter bzw. Einordnung nennt das Skript für „Differentielle Gelegenheiten“?","Richard Cloward und Lloyd Ohlin  ·  Makro–Meso–Mikro"],["skript17","Erläutere den Mechanismus von „Differentielle Gelegenheiten“ in eigenen Worten.","Cloward und Ohlin ergänzen strukturell ungleiche legale Chancen um ungleichen Zugang zu illegalen Lern- und Erwerbsgelegenheiten. Kriminelle, konfliktorientierte und Rückzugssubkulturen stehen für idealtypische lokale Bedingungen."],["skript18","Welcher Erklärungsansatz steht im Mittelpunkt von „Kulturkonflikttheorie“?","Sellin untersucht Konflikte zwischen Verhaltensnormen sozialer Gruppen und staatlich geltenden Normen. Ein Konflikt kann aus dem Aufeinandertreffen unterschiedlicher Normordnungen oder aus Differenzierung innerhalb einer Gesellschaft entstehen."],["skript18","Welche Vertreter bzw. Einordnung nennt das Skript für „Kulturkonflikttheorie“?","Thorsten Sellin  ·  Meso–Makro mit individuellen Folgen"],["skript18","Erläutere den Mechanismus von „Kulturkonflikttheorie“ in eigenen Worten.","Sellin untersucht Konflikte zwischen Verhaltensnormen sozialer Gruppen und staatlich geltenden Normen. Ein Konflikt kann aus dem Aufeinandertreffen unterschiedlicher Normordnungen oder aus Differenzierung innerhalb einer Gesellschaft entstehen."],["skript19","Welcher Erklärungsansatz steht im Mittelpunkt von „Code of the Street“?","Anderson untersucht, wie in bestimmten marginalisierten urbanen Kontexten öffentlich gezeigter Respekt und die glaubhafte Bereitschaft zur Gegenwehr Schutz versprechen können. Personen können zwischen situativen Verhaltensregeln wechseln."],["skript19","Welche Vertreter bzw. Einordnung nennt das Skript für „Code of the Street“?","Elijah Anderson  ·  Meso–Mikro mit Strukturbezug"],["skript19","Erläutere den Mechanismus von „Code of the Street“ in eigenen Worten.","Anderson untersucht, wie in bestimmten marginalisierten urbanen Kontexten öffentlich gezeigter Respekt und die glaubhafte Bereitschaft zur Gegenwehr Schutz versprechen können. Personen können zwischen situativen Verhaltensregeln wechseln."],["skript20","Welcher Erklärungsansatz steht im Mittelpunkt von „Soziale Desorganisation“?","Shaw und McKay verbinden strukturelle Bedingungen wie Armut und häufige Fluktuation mit Schwierigkeiten, dauerhaft lokale Netzwerke und informelle Kontrolle aufzubauen. Zu erklären sind räumliche Unterschiede und ihre Stabilität trotz wechselnder Bewohner."],["skript20","Welche Vertreter bzw. Einordnung nennt das Skript für „Soziale Desorganisation“?","Clifford Shaw und Henry McKay  ·  Meso; strukturelle Makrobezüge"],["skript20","Erläutere den Mechanismus von „Soziale Desorganisation“ in eigenen Worten.","Shaw und McKay verbinden strukturelle Bedingungen wie Armut und häufige Fluktuation mit Schwierigkeiten, dauerhaft lokale Netzwerke und informelle Kontrolle aufzubauen. Zu erklären sind räumliche Unterschiede und ihre Stabilität trotz wechselnder Bewohner."],["skript21","Welcher Erklärungsansatz steht im Mittelpunkt von „Kollektive Wirksamkeit“?","Sampson und Kollegen verbinden sozialen Zusammenhalt und Vertrauen mit geteilten Erwartungen, bei Problemen zum Wohl der Gemeinschaft einzugreifen. Eingreifen kann auch in koordinierter Hilfe oder Ansprache zuständiger Stellen bestehen."],["skript21","Welche Vertreter bzw. Einordnung nennt das Skript für „Kollektive Wirksamkeit“?","Robert Sampson, Stephen Raudenbush und Felton Earls  ·  Meso"],["skript21","Erläutere den Mechanismus von „Kollektive Wirksamkeit“ in eigenen Worten.","Sampson und Kollegen verbinden sozialen Zusammenhalt und Vertrauen mit geteilten Erwartungen, bei Problemen zum Wohl der Gemeinschaft einzugreifen. Eingreifen kann auch in koordinierter Hilfe oder Ansprache zuständiger Stellen bestehen."],["skript22","Welcher Erklärungsansatz steht im Mittelpunkt von „Broken Windows Ansatz“?","Der Ansatz vermutet eine Kette von sichtbarer Unordnung über Rückzug und schwächere informelle Kontrolle hin zu schwereren Delikten. Die einzelnen Pfeile sind empirische Behauptungen und müssen getrennt geprüft werden."],["skript22","Welche Vertreter bzw. Einordnung nennt das Skript für „Broken Windows Ansatz“?","James Q. Wilson und George L. Kelling  ·  Meso mit Mikroprozessen"],["skript22","Erläutere den Mechanismus von „Broken Windows Ansatz“ in eigenen Worten.","Der Ansatz vermutet eine Kette von sichtbarer Unordnung über Rückzug und schwächere informelle Kontrolle hin zu schwereren Delikten. Die einzelnen Pfeile sind empirische Behauptungen und müssen getrennt geprüft werden."],["skript23","Welcher Erklärungsansatz steht im Mittelpunkt von „Anomie bei Durkheim“?","Durkheim beschreibt Anomie als Schwächung sozialer Regulierung, etwa bei raschem wirtschaftlichem oder sozialem Wandel. Die Normalität von Kriminalität ist eine weitere These. Normverletzungen kommen in Gesellschaften regelmäßig vor und können Grenzziehungen sichtbar machen."],["skript23","Welche Vertreter bzw. Einordnung nennt das Skript für „Anomie bei Durkheim“?","Émile Durkheim  ·  Makro"],["skript23","Erläutere den Mechanismus von „Anomie bei Durkheim“ in eigenen Worten.","Durkheim beschreibt Anomie als Schwächung sozialer Regulierung, etwa bei raschem wirtschaftlichem oder sozialem Wandel. Die Normalität von Kriminalität ist eine weitere These. Normverletzungen kommen in Gesellschaften regelmäßig vor und können Grenzziehungen sichtbar machen."],["skript24","Welcher Erklärungsansatz steht im Mittelpunkt von „Anomie oder Strain Theorie bei Merton“?","Merton unterscheidet kulturell stark betonte Ziele und institutionell gebilligte Mittel. Ungleicher Zugang zu den Mitteln begünstigt verschiedene Anpassungen. Konformität akzeptiert beides, Innovation behält Ziele bei, Ritualismus hält an Mitteln fest, Rückzug verwirft beides und Rebellion strebt Ersatz an."],["skript24","Welche Vertreter bzw. Einordnung nennt das Skript für „Anomie oder Strain Theorie bei Merton“?","Robert K. Merton  ·  Makro mit individuellen Anpassungsformen"],["skript24","Erläutere den Mechanismus von „Anomie oder Strain Theorie bei Merton“ in eigenen Worten.","Merton unterscheidet kulturell stark betonte Ziele und institutionell gebilligte Mittel. Ungleicher Zugang zu den Mitteln begünstigt verschiedene Anpassungen. Konformität akzeptiert beides, Innovation behält Ziele bei, Ritualismus hält an Mitteln fest, Rückzug verwirft beides und Rebellion strebt Ersatz an."],["skript25","Welcher Erklärungsansatz steht im Mittelpunkt von „Institutionelle Anomietheorie“?","Messner und Rosenfeld verbinden eine Kultur des Erfolgsstrebens mit institutionellem Ungleichgewicht. Ökonomische Dominanz kann sich in Abwertung, Anpassung und Durchdringung nichtökonomischer Institutionen zeigen. Die Erklärung richtet sich auf gesellschaftliche Kriminalitätsmuster."],["skript25","Welche Vertreter bzw. Einordnung nennt das Skript für „Institutionelle Anomietheorie“?","Steven Messner und Richard Rosenfeld  ·  Makro"],["skript25","Erläutere den Mechanismus von „Institutionelle Anomietheorie“ in eigenen Worten.","Messner und Rosenfeld verbinden eine Kultur des Erfolgsstrebens mit institutionellem Ungleichgewicht. Ökonomische Dominanz kann sich in Abwertung, Anpassung und Durchdringung nichtökonomischer Institutionen zeigen. Die Erklärung richtet sich auf gesellschaftliche Kriminalitätsmuster."],["skript26","Welcher Erklärungsansatz steht im Mittelpunkt von „Konflikt und marxistische Ansätze“?","Unter anderem Willem Bonger, Richard Quinney und William Chambliss  ·  Makro mit Bezügen zu weiteren Ebenen Die Ansätze teilen das Interesse an Macht und ungleichen Ressourcen. Bonger betont ökonomische Bedingungen, während konfliktorientierte Arbeiten auch fragen, welche Interessen in Gesetzgebung und Kontrolle durchgesetzt werden."],["skript26","Welche Vertreter bzw. Einordnung nennt das Skript für „Konflikt und marxistische Ansätze“?","Unter anderem Willem Bonger, Richard Quinney und William Chambliss  ·  Makro mit Bezügen zu weiteren Ebenen"],[  Alltagsroutinen verändern die Häufigkeit dieser Konstellationen."],["skript29","Welcher Erklärungsansatz steht im Mittelpunkt von „Crime Pattern Theory“?","Die Brantinghams verknüpfen Tatorte mit alltäglichen Wegen, Anlaufpunkten und den dadurch bekannten Räumen. Übergänge und Orte mit vielen Aktivitäten können Gelegenheiten räumlich bündeln."],["skript29","Welche Vertreter bzw. Einordnung nennt das Skript für „Crime Pattern Theory“?","Patricia und Paul Brantingham  ·  Situation und Meso"],["skript29","Erläutere den Mechanismus von „Crime Pattern Theory“ in eigenen Worten.","Die Brantinghams verknüpfen Tatorte mit alltäglichen Wegen, Anlaufpunkten und den dadurch bekannten Räumen. Übergänge und Orte mit vielen Aktivitäten können Gelegenheiten räumlich bündeln."],["skript30","Welcher Erklärungsansatz steht im Mittelpunkt von „Situational Action Theory oder SAT“?","Wikström erklärt Taten über einen Wahrnehmungs- und Entscheidungsprozess. Persönliche Moral und wahrgenommene Regeln des Settings beeinflussen, welche Handlungen überhaupt als Alternativen erscheinen. Bei einer Abwägung können Selbstkontrolle und Abschreckung relevant werden."],["skript30","Welche Vertreter bzw. Einordnung nennt das Skript für „Situational Action Theory oder SAT“?","Per-Olof H. Wikström  ·  Verbindet Mikro, Meso und Makro"],["skript30","Erläutere den Mechanismus von „Situational Action Theory oder SAT“ in eigenen Worten.","Wikström erklärt Taten über einen Wahrnehmungs- und Entscheidungsprozess. Persönliche Moral und wahrgenommene Regeln des Settings beeinflussen, welche Handlungen überhaupt als Alternativen erscheinen. Bei einer Abwägung können Selbstkontrolle und Abschreckung relevant werden."],["skript31","Welcher Erklärungsansatz steht im Mittelpunkt von „Labeling oder Etikettierung“?","Tannenbaum, Lemert und Becker setzen unterschiedliche Akzente. Gemeinsam ist der Blick auf Regeln, ihre Anwendung und die Folgen sozialer Reaktionen. Becker fragt auch danach, wer Regeln durchsetzt und wer als Außenseiter gilt."],["skript31","Welche Vertreter bzw. Einordnung nennt das Skript für „Labeling oder Etikettierung“?","Frank Tannenbaum, Edwin Lemert, Howard S. Becker  ·  Mikro–Makro"],["skript31","Erläutere den Mechanismus von „Labeling oder Etikettierung“ in eigenen Worten.","Tannenbaum, Lemert und Becker setzen unterschiedliche Akzente. Gemeinsam ist der Blick auf Regeln, ihre Anwendung und die Folgen sozialer Reaktionen. Becker fragt auch danach, wer Regeln durchsetzt und wer als Außenseiter gilt."],["skript32","Welcher Erklärungsansatz steht im Mittelpunkt von „Primäre und sekundäre Devianz“?","Lemert trennt anfängliche Normverletzungen mit unterschiedlichen Ursachen von sekundärer Devianz als möglicher Reaktion auf soziale Folgen der Etikettierung. Eine veränderte Rolle und eingeschränkte konventionelle Möglichkeiten sind mögliche Zwischenschritte."],["skript32","Welche Vertreter bzw. Einordnung nennt das Skript für „Primäre und sekundäre Devianz“?","Edwin Lemert  ·  Mikro–Meso"],["skript32","Erläutere den Mechanismus von „Primäre und sekundäre Devianz“ in eigenen Worten.","Lemert trennt anfängliche Normverletzungen mit unterschiedlichen Ursachen von sekundärer Devianz als möglicher Reaktion auf soziale Folgen der Etikettierung. Eine veränderte Rolle und eingeschränkte konventionelle Möglichkeiten sind mögliche Zwischenschritte."],["skript33","Welcher Erklärungsansatz steht im Mittelpunkt von „Reintegrative Shaming“?","Braithwaite unterscheidet Reaktionen, die Missbilligung der Handlung mit Wiederaufnahme in eine Gemeinschaft verbinden, von dauerhaft ausgrenzenden Reaktionen. Soziale Beziehungen geben der Missbilligung Gewicht und ermöglichen Rückkehr."],["skript33","Welche Vertreter bzw. Einordnung nennt das Skript für „Reintegrative Shaming“?","John Braithwaite  ·  Mikro–Makro"],["skript33","Erläutere den Mechanismus von „Reintegrative Shaming“ in eigenen Worten.","Braithwaite unterscheidet Reaktionen, die Missbilligung der Handlung mit Wiederaufnahme in eine Gemeinschaft verbinden, von dauerhaft ausgrenzenden Reaktionen. Soziale Beziehungen geben der Missbilligung Gewicht und ermöglichen Rückkehr."],["skript34","Welcher Erklärungsansatz steht im Mittelpunkt von „Defiance Theory“?","Sherman beschreibt Trotz als mögliche Reaktion auf als unfair wahrgenommene Sanktion. Schwache Bindung an die sanktionierende Instanz und eine als stigmatisierend empfundene Behandlung können die Reaktion begünstigen."],["skript34","Welche Vertreter bzw. Einordnung nennt das Skript für „Defiance Theory“?","Lawrence W. Sherman  ·  Mikro–Meso"],["skript34","Erläutere den Mechanismus von „Defiance Theory“ in eigenen Worten.","Sherman beschreibt Trotz als mögliche Reaktion auf als unfair wahrgenommene Sanktion. Schwache Bindung an die sanktionierende Instanz und eine als stigmatisierend empfundene Behandlung können die Reaktion begünstigen."],["skript35","Welcher Erklärungsansatz steht im Mittelpunkt von „Age Graded Theory“?","Sampson und Laub untersuchen, wie altersabhängige informelle Bindungen im Lebensverlauf wirken. Stabile Arbeit oder tragfähige Beziehungen können Routinen, Aufsicht und Zukunftsinvestitionen verändern. Ein Lebensereignis wird durch seine Folgen für die tatsächliche Lebensführung zum Wendepunkt."],["skript35","Welche Vertreter bzw. Einordnung nennt das Skript für „Age Graded Theory“?","Robert Sampson und John Laub  ·  Mikro–Meso"],["skript35","Erläutere den Mechanismus von „Age Graded Theory“ in eigenen Worten.","Sampson und Laub untersuchen, wie altersabhängige informelle Bindungen im Lebensverlauf wirken. Stabile Arbeit oder tragfähige Beziehungen können Routinen, Aufsicht und Zukunftsinvestitionen verändern. Ein Lebensereignis wird durch seine Folgen für die tatsächliche Lebensführung zum Wendepunkt."],["skript36","Welcher Erklärungsansatz steht im Mittelpunkt von „Entwicklungstaxonomie oder Two Path Theory“?","Moffitt unterscheidet idealtypisch einen früh beginnenden, über Lebensphasen anhaltenden Verlauf und einen vorwiegend auf die Jugend begrenzten Verlauf. Für ersteren sind Wechselwirkungen individueller Entwicklungsrisiken und belastender Umwelten zentral. Beim zweiten spielt die Lücke zwischen biologischer und sozialer Reife eine Rolle."],["skript36","Welche Vertreter bzw. Einordnung nennt das Skript für „Entwicklungstaxonomie oder Two Path Theory“?","Terrie E. Moffitt  ·  Mikro–Meso"],["skript36","Erläutere den Mechanismus von „Entwicklungstaxonomie oder Two Path Theory“ in eigenen Worten.","Moffitt unterscheidet idealtypisch einen früh beginnenden, über Lebensphasen anhaltenden Verlauf und einen vorwiegend auf die Jugend begrenzten Verlauf. Für ersteren sind Wechselwirkungen individueller Entwicklungsrisiken und belastender Umwelten zentral. Beim zweiten spielt die Lücke zwischen biologischer und sozialer Reife eine Rolle."],["skript37","Welcher Erklärungsansatz steht im Mittelpunkt von „Interactional Theory“?","Thornberry betrachtet Bindungen, Peers, Überzeugungen und Delinquenz als wechselseitig verbunden. Schwache Bindungen können Delinquenz fördern. Delinquenz kann ihrerseits Bindungen schwächen und Zugang zu delinquenten Gruppen verändern."],["skript37","Welche Vertreter bzw. Einordnung nennt das Skript für „Interactional Theory“?","Terence P. Thornberry  ·  Mikro–Meso"],["skript37","Erläutere den Mechanismus von „Interactional Theory“ in eigenen Worten.","Thornberry betrachtet Bindungen, Peers, Überzeugungen und Delinquenz als wechselseitig verbunden. Schwache Bindungen können Delinquenz fördern. Delinquenz kann ihrerseits Bindungen schwächen und Zugang zu delinquenten Gruppen verändern."],["skript38","Welcher Erklärungsansatz steht im Mittelpunkt von „Karrieremodelle“?","Prozessmodelle betrachten wiederholte Delinquenz als Verlauf, in dem Verhalten, Sanktion, soziale Reaktionen und Gelegenheiten aufeinander folgen können. Quensels und Hess’ Modelle setzen jeweils eigene Akzente bei der Verbindung von Handeln und gesellschaftlicher Reaktion."],["skript38","Welche Vertreter bzw. Einordnung nennt das Skript für „Karrieremodelle“?","Stephan Quensel; Henner Hess  ·  Mikro–Makro"],["skript38","Erläutere den Mechanismus von „Karrieremodelle“ in eigenen Worten.","Prozessmodelle betrachten wiederholte Delinquenz als Verlauf, in dem Verhalten, Sanktion, soziale Reaktionen und Gelegenheiten aufeinander folgen können. Quensels und Hess’ Modelle setzen jeweils eigene Akzente bei der Verbindung von Handeln und gesellschaftlicher Reaktion."],["skript39","Welcher Erklärungsansatz steht im Mittelpunkt von „Feministische Kriminologien“?","Feministische Kriminologien untersuchen geschlechtlich strukturierte Macht, Kriminalisierung, Viktimisierung und institutionelle Reaktionen. Unterschiedliche Strömungen betonen etwa Arbeitsteilung, Gewaltverhältnisse oder das Zusammenwirken von Geschlecht mit weiteren Ungleichheiten."],["skript39","Welche Vertreter bzw. Einordnung nennt das Skript für „Feministische Kriminologien“?","Unter anderem Frances Heidensohn, Carol Smart, Meda Chesney-Lind  ·  Mehrere Ebenen"],["skript39","Erläutere den Mechanismus von „Feministische Kriminologien“ in eigenen Worten.","Feministische Kriminologien untersuchen geschlechtlich strukturierte Macht, Kriminalisierung, Viktimisierung und institutionelle Reaktionen. Unterschiedliche Strömungen betonen etwa Arbeitsteilung, Gewaltverhältnisse oder das Zusammenwirken von Geschlecht mit weiteren Ungleichheiten."],["skript40","Welcher Erklärungsansatz steht im Mittelpunkt von „Power Control Theorie“?","Hagan und Kollegen verbinden Machtverhältnisse im Erwerbsleben mit geschlechtsspezifischer Kontrolle im Haushalt. Unterschiede in Beaufsichtigung und Freiräumen können Unterschiede in Risikoneigung und Delinquenz mit erklären."],["skript40","Welche Vertreter bzw. Einordnung nennt das Skript für „Power Control Theorie“?","John Hagan und Mitarbeitende  ·  Makro–Meso–Mikro"],["skript40","Erläutere den Mechanismus von „Power Control Theorie“ in eigenen Worten.","Hagan und Kollegen verbinden Machtverhältnisse im Erwerbsleben mit geschlechtsspezifischer Kontrolle im Haushalt. Unterschiede in Beaufsichtigung und Freiräumen können Unterschiede in Risikoneigung und Delinquenz mit erklären."],["skript41","Welcher Erklärungsansatz steht im Mittelpunkt von „Cultural Criminology“?","Cultural Criminology untersucht Bedeutungen von Kriminalität und Kontrolle, etwa Stil, Emotionen, Medienbilder und kulturelle Aushandlung. Sie verbindet das Erleben in Situationen mit öffentlicher Darstellung."],["skript41","Welche Vertreter bzw. Einordnung nennt das Skript für „Cultural Criminology“?","Jeff Ferrell, Keith Hayward, Jock Young  ·  Mikro–Makro"],["skript41","Erläutere den Mechanismus von „Cultural Criminology“ in eigenen Worten.","Cultural Criminology untersucht Bedeutungen von Kriminalität und Kontrolle, etwa Stil, Emotionen, Medienbilder und kulturelle Aushandlung. Sie verbindet das Erleben in Situationen mit öffentlicher Darstellung."],["skript42","Welcher Erklärungsansatz steht im Mittelpunkt von „Mikrosoziologie der Gewalt“?","Collins rückt die Dynamik der direkten Konfrontation in den Mittelpunkt. Angst und Anspannung können gewaltbereite Personen hemmen. Die emotionale Dominanz einer Seite und die Dynamik einer Gruppe können die Situation verändern. Vorwärtspanik bezeichnet bei Collins eine besondere Eskalation nach aufgestauter Spannung."],["skript42","Welche Vertreter bzw. Einordnung nennt das Skript für „Mikrosoziologie der Gewalt“?","Randall Collins  ·  Mikro und Situation"],["skript42","Erläutere den Mechanismus von „Mikrosoziologie der Gewalt“ in eigenen Worten.","Collins rückt die Dynamik der direkten Konfrontation in den Mittelpunkt. Angst und Anspannung können gewaltbereite Personen hemmen. Die emotionale Dominanz einer Seite und die Dynamik einer Gruppe können die Situation verändern. Vorwärtspanik bezeichnet bei Collins eine besondere Eskalation nach aufgestauter Spannung."],["skript43","Welcher Erklärungsansatz steht im Mittelpunkt von n, dauerhaft lokale Netzwerke und informelle Kontrolle aufzubauen.","Cohen und Felson erklären Deliktereignisse über das zeitliche und räumliche Zusammentreffen eines motivierten Täters, eines geeigneten Ziels und fehlender wirksamer Aufsicht.","Sampson und Laub untersuchen, wie altersabhängige informelle Bindungen im Lebensverlauf wirken."],"c":1,"e":"Shaw und McKay verbinden strukturelle Bedingungen wie Armut und häufige Fluktuation mit Schwierigkeiten, dauerhaft lokale Netzwerke und informelle Kontrolle aufzubauen. Zu erklären sind räumliche Unterschiede und ihre Stabilität trotz wechselnder Bewohner."},{"t":"skript20","q":"Welcher Theorie ist folgende Kernaussage zuzuordnen? „Shaw und McKay verbinden strukturelle Bedingungen wie Armut und häufige Fluktuation mit Schwierigkeiten, dauerhaft lokale Netzwerke und informelle Kontrolle aufzubauen.“","a":["Routine Activity Approach","Reintegrative Shaming","Karrieremodelle","Soziale Desorganisation"],"c":3,"e":"Zuordnung: Soziale Desorganisation. Shaw und McKay verbinden strukturelle Bedingungen wie Armut und häufige Fluktuation mit Schwierigkeiten, dauerhaft lokale Netzwerke und informelle Kontrolle aufzubauen. Zu erklären sind räumliche Unterschiede und ihre Stabilität trotz wechselnder Bewohner."},{"t":"skript21","q":"Welche Aussage beschreibt „Kollektive Wirksamkeit“ gemäß dem Lernskript am treffendsten?","a":["Sampson und Kollegen verbinden sozialen Zusammenhalt und Vertrauen mit geteilten Erwartungen, bei Problemen zum Wohl der Gemeinschaft einzugreifen.","Die Brantinghams verknüpfen Tatorte mit alltäglichen Wegen, Anlaufpunkten und den dadurch bekannten Räumen.","Moffitt unterscheidet idealtypisch einen früh beginnenden, über Lebensphasen anhaltenden Verlauf und einen vorwiegend auf die Jugend begrenzten Verlauf.","Kategorisierung und Identifikation machen die eigene Gruppe zu einem Teil des Selbstbilds."],"c":0,"e":"Sampson und Kollegen verbinden sozialen Zusammenhalt und Vertrauen mit geteilten Erwartungen, bei Problemen zum Wohl der Gemeinschaft einzugreifen. Eingreifen kann auch in koordinierter Hilfe oder Ansprache zuständiger Stellen bestehen."},{"t":"skript21","q":"Welcher Theorie ist folgende Kernaussage zuzuordnen? „Sampson und Kollegen verbinden sozialen Zusammenhalt und Vertrauen mit geteilten Erwartungen, bei Problemen zum Wohl der Gemeinschaft einzugreifen.“","a":["Defiance Theory","Feministische Kriminologien","Kollektive Wirksamkeit","Crime Pattern Theory"],"c":2,"e":"Zuordnung: Kollektive Wirksamkeit. Sampson und Kollegen verbinden sozialen Zusammenhalt und Vertrauen mit geteilten Erwartungen, bei Problemen zum Wohl der Gemeinschaft einzugreifen. Eingreifen kann auch in koordinierter Hilfe oder Ansprache zuständiger Stellen bestehen."},{"t":"skript22","q":"Welche Aussage beschreibt „Broken Windows Ansatz“ gemäß dem Lernskript am treffendsten?","a":["Wikström erklärt Taten über einen Wahrnehmungs- und Entscheidungsprozess.","Thornberry betrachtet Bindungen, Peers, Überzeugungen und Delinquenz als wechselseitig verbunden.","Eine glaubwürdig erwartete Sanktion verändert die Entscheidung vor der Tat.","Der Ansatz vermutet eine Kette von sichtbarer Unordnung über Rückzug und schwächere informelle Kontrolle hin zu schwereren Delikten."],"c":3,"e":"Der Ansatz vermutet eine Kette von sichtbarer Unordnung über Rückzug und schwächere informelle Kontrolle hin zu schwereren Delikten. Die einzelnen Pfeile sind empirische Behauptungen und müssen getrennt geprüft werden."},{"t":"skript22","q":"Welcher Theorie ist folgende Kernaussage zuzuordnen? „Der Ansatz vermutet eine Kette von sichtbarer Unordnung über Rückzug und schwächere informelle Kontrolle hin zu schwereren Delikten.“","a":["Power Control Theorie","Broken Windows Ansatz","Situational Action Theory oder SAT","Age Graded Theory"],"c":1,"e":"Zuordnung: Broken Windows Ansatz. Der Ansatz vermutet eine Kette von sichtbarer Unordnung über Rückzug und schwächere informelle Kontrolle hin zu schwereren Delikten. Die einzelnen Pfeile sind empirische Behauptungen und müssen getrennt geprüft werden."},{"t":"skript23","q":"Welche Aussage beschreibt „Anomie bei Durkheim“ gemäß dem Lernskript am treffendsten?","a":["Prozessmodelle betrachten wiederholte Delinquenz als Verlauf, in dem Verhalten, Sanktion, soziale Reaktionen und Gelegenheiten aufeinander folgen können.","Becker modelliert Entscheidungen ökonomisch.","Durkheim beschreibt Anomie als Schwächung sozialer Regulierung, etwa bei raschem wirtschaftlichem oder sozialem Wandel.","Tannenbaum, Lemert und Becker setzen unterschiedliche Akzente."],"c":2,"e":"Durkheim beschreibt Anomie als Schwächung sozialer Regulierung, etwa bei raschem wirtschaftlichem oder sozialem Wandel. Die Normalität von Kriminalität ist eine weitere These. Normverletzungen kommen in Gesellschaften regelmäßig vor und können Grenzziehungen sichtbar machen."},{"t":"skript23","q":"Welcher Theorie ist folgende Kernaussage zuzuordnen? „Durkheim beschreibt Anomie als Schwächung sozialer Regulierung, etwa bei raschem wirtschaftlichem oder sozialem Wandel.“","a":["Anomie bei Durkheim","Labeling oder Etikettierung","Entwicklungstaxonomie oder Two Path Theory","Cultural Criminology"],"c":0,"e":"Zuordnung: Anomie bei Durkheim. Durkheim beschreibt Anomie als Schwächung sozialer Regulierung, etwa bei raschem wirtschaftlichem oder sozialem Wandel. Die Normalität von Kriminalität ist eine weitere These. Normverletzungen kommen in Gesellschaften regelmäßig vor und können Grenzziehungen sichtbar machen."},{"t":"skript24","q":"Welche Aussage beschreibt „Anomie oder Strain Theorie bei Merton“ gemäß dem Lernskript am treffendsten?","a":["Die Theorie verbindet eine relativ stabile Neigung zu unmittelbarer Bedürfnisbefriedigung mit verfügbaren Gelegenheiten.","Merton unterscheidet kulturell stark betonte Ziele und institutionell gebilligte Mittel.","Lemert trennt anfängliche Normverletzungen mit unterschiedlichen Ursachen von sekundärer Devianz als möglicher Reaktion auf soziale Folgen nstitutionen zeigen. Die Erklärung richtet sich auf gesellschaftliche Kriminalitätsmuster."},{"t":"skript25","q":"Welcher Theorie ist folgende Kernaussage zuzuordnen? „Messner und Rosenfeld verbinden eine Kultur des Erfolgsstrebens mit institutionellem Ungleichgewicht.“","a":["Karrieremodelle","Theorie der sozialen Identität","Institutionelle Anomietheorie","Reintegrative Shaming"],"c":2,"e":"Zuordnung: Institutionelle Anomietheorie. Messner und Rosenfeld verbinden eine Kultur des Erfolgsstrebens mit institutionellem Ungleichgewicht. Ökonomische Dominanz kann sich in Abwertung, Anpassung und Durchdringung nichtökonomischer Institutionen zeigen. Die Erklärung richtet sich auf gesellschaftliche Kriminalitätsmuster."},{"t":"skript26","q":"Welche Aussage beschreibt „Konflikt und marxistische Ansätze“ gemäß dem Lernskript am treffendsten?","a":["Sherman beschreibt Trotz als mögliche Reaktion auf als unfair wahrgenommene Sanktion.","Cultural Criminology untersucht Bedeutungen von Kriminalität und Kontrolle, etwa Stil, Emotionen, Medienbilder und kulturelle Aushandlung.","Lombroso deutete körperliche Merkmale als Ausdruck eines angeblichen evolutionären Rückfalls.","Unter anderem Willem Bonger, Richard Quinney und William Chambliss  ·  Makro mit Bezügen zu weiteren Ebenen Die Ansätze teilen das Interesse an Macht und ungleichen Ressourcen."],"c":3,"e":"Unter anderem Willem Bonger, Richard Quinney und William Chambliss  ·  Makro mit Bezügen zu weiteren Ebenen Die Ansätze teilen das Interesse an Macht und ungleichen Ressourcen. Bonger betont ökonomische Bedingungen, während konfliktorientierte Arbeiten auch fragen, welche Interessen in Gesetzgebung und Kontrolle durchgesetzt werden."},{"t":"skript26","q":"Welcher Theorie ist folgende Kernaussage zuzuordnen? „Unter anderem Willem Bonger, Richard Quinney und William Chambliss  ·  Makro mit Bezügen zu weiteren Ebenen Die Ansätze teilen das Interesse an Macht und ungleichen Ressourcen.“","a":["Klassische Schule","Konflikt und ma
