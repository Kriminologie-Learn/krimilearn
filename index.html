ei einer Abwägung können Selbstkontrolle und Abschreckung relevant werden."},{"t":"skript31","q":"Welche Aussage beschreibt „Labeling oder Etikettierung“ gemäß dem Lernskript am treffendsten?","a":["Die Theorie verbindet eine relativ stabile Neigung zu unmittelbarer Bedürfnisbefriedigung mit verfügbaren Gelegenheiten.","Akers ergänzt Definitionen und Kontakte um Nachahmung und differentielle Verstärkung.","Tannenbaum, Lemert und Becker setzen unterschiedliche Akzente.","Feministische Kriminologien untersuchen geschlechtlich strukturierte Macht, Kriminalisierung, Viktimisierung und institutionelle Reaktionen."],"c":2,"e":"Tannenbaum, Lemert und Becker setzen unterschiedliche Akzente. Gemeinsam ist der Blick auf Regeln, ihre Anwendung und die Folgen sozialer Reaktionen. Becker fragt auch danach, wer Regeln durchsetzt und wer als Außenseiter gilt."},{"t":"skript31","q":"Welcher Theorie ist folgende Kernaussage zuzuordnen? „Tannenbaum, Lemert und Becker setzen unterschiedliche Akzente.“","a":["Labeling oder Etikettierung","Feministische Kriminologien","Klassische Schule","Persönlichkeitstheorie"],"c":0,"e":"Zuordnung: Labeling oder Etikettierung. Tannenbaum, Lemert und Becker setzen unterschiedliche Akzente. Gemeinsam ist der Blick auf Regeln, ihre Anwendung und die Folgen sozialer Reaktionen. Becker fragt auch danach, wer Regeln durchsetzt und wer als Außenseiter gilt."},{"t":"skript32","q":"Welche Aussage beschreibt „Primäre und sekundäre Devianz“ gemäß dem Lernskript am treffendsten?","a":["Sykes und Matza beschreiben fünf Rechtfertigungen, die eine Norm situativ außer Kraft setzen können.","Lemert trennt anfängliche Normverletzungen mit unterschiedlichen Ursachen von sekundärer Devianz als möglicher Reaktion auf soziale Folgen der Etikettierung.","Hagan und Kollegen verbinden Machtverhältnisse im Erwerbsleben mit geschlechtsspezifischer Kontrolle im Haushalt.","Agnew unterscheidet das Verfehlen positiv bewerteter Ziele, den Verlust positiver Reize und die Konfrontation mit negativen Reizen."],"c":1,"e":"Lemert trennt anfängliche Normverletzungen mit unterschiedlichen Ursachen von sekundärer Devianz als möglicher Reaktion auf soziale Folgen der Etikettierung. Eine veränderte Rolle und eingeschränkte konventionelle Möglichkeiten sind mögliche Zwischenschritte."},{"t":"skript32","q":"Welcher Theorie ist folgende Kernaussage zuzuordnen? „Lemert trennt anfängliche Normverletzungen mit unterschiedlichen Ursachen von sekundärer Devianz als möglicher Reaktion auf soziale Folgen der Etikettierung.“","a":["Power Control Theorie","Rational Choice","Biosoziale Ansätze","Primäre und sekundäre Devianz"],"c":3,"e":"Zuordnung: Primäre und sekundäre Devianz. Lemert trennt anfängliche Normverletzungen mit unterschiedlichen Ursachen von sekundärer Devianz als möglicher Reaktion auf soziale Folgen der Etikettierung. Eine veränderte Rolle und eingeschränkte konventionelle Möglichkeiten sind mögliche Zwischenschritte."},{"t":"skript33","q":"Welche Aussage beschreibt „Reintegrative Shaming“ gemäß dem Lernskript am treffendsten?","a":["Braithwaite unterscheidet Reaktionen, die Missbilligung der Handlung mit Wiederaufnahme in eine Gemeinschaft verbinden, von dauerhaft ausgrenzenden Reaktionen.","Cultural Criminology untersucht Bedeutungen von Kriminalität und Kontrolle, etwa Stil, Emotionen, Medienbilder und kulturelle Aushandlung.","Lombroso deutete körperliche Merkmale als Ausdruck eines angeblichen evolutionären Rückfalls.","Matza beschreibt einen zeitweisen Zustand gelockerter Bindung an konventionelle Normen."],"c":0,"e":"Braithwaite unterscheidet Reaktionen, die Missbilligung der Handlung mit Wiederaufnahme in eine Gemeinschaft verbinden, von dauerhaft ausgrenzenden Reaktionen. Soziale Beziehungen geben der Missbilligung Gewicht und ermöglichen Rückkehr."},{"t":"skript33","q":"Welcher Theorie ist folgende Kernaussage zuzuordnen? „Braithwaite unterscheidet Reaktionen, die Missbilligung der Handlung mit Wiederaufnahme in eine Gemeinschaft verbinden, von dauerhaft ausgrenzenden Reaktionen.“","a":["Selbstkontrolltheorie","Seductions of Crime","Reintegrative Shaming","Cultural Criminology"],"c":2,"e":"Zuordnung: Reintegrative Shaming. Braithwaite unterscheidet Reaktionen, die Missbilligung der Handlung mit Wiederaufnahme in eine Gemeinschaft verbinden, von dauerhaft ausgrenzenden Reaktionen. Soziale Beziehungen geben der Missbilligung Gewicht und ermöglichen Rückkehr."},{"t":"skript34","q":"Welche Aussage beschreibt „Defiance Theory“ gemäß dem Lernskript am treffendsten?","a":["Collins rückt die Dynamik der direkten Konfrontation in den Mittelpunkt.","Eysenck verbindet Persönlichkeitsdimensionen und Konditionierung.","Hirschi unterscheidet emotionale Bindung, Investitionen in konventionelle Ziele, Einbindung in konventionelle Aktivitäten und Glauben an die Geltung von Normen.","Sherman beschreibt Trotz als mögliche Reaktion auf als unfair wahrgenommene Sanktion."],"c":3,"e":"Sherman beschreibt Trotz als mögliche Reaktion auf als unfair wahrgenommene Sanktion. Schwache Bindung an die sanktionierende Instanz und eine als stigmatisierend empfundene Behandlung können die Reaktion begünstigen."},{"t":"skript34","q":"Welcher Theorie ist folgende Kernaussage zuzuordnen? „Sherman beschreibt Trotz als mögliche Reaktion auf als unfair wahrgenommene Sanktion.“","a":["Differentielle Assoziation","Defiance Theory","Mikrosoziologie der Gewalt","General Strain Theory"],"c":1,"e":"Zuordnung: Defiance Theory. Sherman beschreibt Trotz als mögliche Reaktion auf als unfair wahrgenommene Sanktion. Schwache Bindung an die sanktionierende Instanz und eine als stigmatisierend empfundene Behandlung können die Reaktion begünstigen."},{"t":"skript35","q":"Welche Aussage beschreibt „Age Graded Theory“ gemäß dem Lernskript am treffendsten?","a":["Biosoziale Arbeiten untersuchen mögliche Wechselwirkungen etwa zwischen neuropsychologischer Entwicklung, Stressregulation und sozialem Umfeld.","Reckless unterscheidet innere und äußere Haltekräfte.","Sampson und Laub untersuchen, wie altersabhängige informelle Bindungen im Lebensverlauf wirken.","Kategorisierung und Identifikation machen die eigene Gruppe zu einem Teil des Selbstbilds."],"c":2,"e":"Sampson und Laub untersuchen, wie altersabhängige informelle Bindungen im Lebensverlauf wirken. Stabile Arbeit oder tragfähige Beziehungen können Routinen, Aufsicht und Zukunftsinvestitionen verändern. Ein Lebensereignis wird durch seine Folgen für die tatsächliche Lebensführung zum Wendepunkt."},{"t":"skript35","q":"Welcher Theorie ist folgende Kernaussage zuzuordnen? „Sampson und Laub untersuchen, wie altersabhängige informelle Bindungen im Lebensverlauf wirken.“","a":["Age Graded Theory","Theorie der sozialen Identität","Kriminalanthropologie","Theorie des sozialen Lernens"],"c":0,"e":"Zuordnung: Age Graded Theory. Sampson und Laub untersuchen, wie altersabhängige informelle Bindungen im Lebensverlauf wirken. Stabile Arbeit oder tragfähige Beziehungen können Routinen, Aufsicht und Zukunftsinvestitionen verändern. Ein Lebensereignis wird durch seine Folgen für die tatsächliche Lebensführung zum Wendepunkt."},{"t":"skript36","q":"Welche Aussage beschreibt „Entwicklungstaxonomie oder Two Path Theory“ gemäß dem Lernskript am treffendsten?","a":["Tittle betrachtet das Verhältnis zwischen ausgeübter und erfahrener Kontrolle.","Moffitt unterscheidet idealtypisch einen früh beginnenden, über Lebensphasen anhaltenden Verlauf und einen vorwiegend auf die Jugend begrenzten Verlauf.","Eine glaubwürdig erwartete Sanktion verändert die Entscheidung vor der Tat.","Katz rekonstruiert, wie eine Tat aus Sicht der handelnden Person im Moment eine besondere emotionale oder moralische Bedeutung gewinnt."],"c":1,"e":"Moffitt unterscheidet idealtypisch einen früh beginnenden, über Lebensphasen anhaltenden Verlauf und einen vorwiegend auf die Jugend begrenzten Verlauf. Für ersteren sind Wechselwirkungen individueller Entwicklungsrisiken und belastender Umwelten zentral. Beim zweiten spielt die Lücke zwischen biologischer und sozialer Reife eine Rolle."},{"t":"skript36","q":"Welcher Theorie ist folgende Kernaussage zuzuordnen? „Moffitt unterscheidet idealtypisch einen früh beginnenden, über Lebensphasen anhaltenden Verlauf und einen vorwiegend auf die Jugend begrenzten Verlauf.“","a":["Klassische Schule","Persönlichkeitstheorie","Neutralisierungstechniken","Entwicklungstaxonomie oder Two Path Theory"],"c":3,"e":"Zuordnung: Entwicklungstaxonomie oder Two Path Theory. Moffitt unterscheidet idealtypisch einen früh beginnenden, über Lebensphasen anhaltenden Verlauf und einen vorwiegend auf die Jugend begrenzten Verlauf. Für ersteren sind Wechselwirkungen individueller Entwicklungsrisiken und belastender Umwelten zentral. Beim zweiten spielt die Lücke zwischen biologischer und sozialer Reife eine Rolle."},{"t":"skript37","q":"Welche Aussage beschreibt „Interactional Theory“ gemäß dem Lernskript am treffendsten?","a":["Thornberry betrachtet Bindungen, Peers, Überzeugungen und Delinquenz als wechselseitig verbunden.","Becker modelliert Entscheidungen ökonomisch.","Sutherland unterscheidet das Lernen von Techniken und das Lernen von Definitionen, die Gesetzesverletzungen begünstigen oder ablehnen.","Cohen erklärt delinquente Gruppenbildung über Statusfrustration."],"c":0,"e":"Thornberry betrachtet Bindungen, Peers, Überzeugungen und Delinquenz als wechselseitig verbunden. Schwache Bindungen können Delinquenz fördern. Delinquenz kann ihrerseits Bindungen schwächen und Zugang zu delinquenten Gruppen verändern."},{"t":"skript37","q":"Welcher Theorie ist folgende Kernaussage zuzuordnen? „Thornberry betrachtet Bindungen, Peers, Überzeugungen und Delinquenz als wechselseitig verbunden.“","a":["Biosoziale Ansätze","Drift Theorie","Interactional Theory","Rational Choice"],"c":2,"e":"Zuordnung: Interactional Theory. Thornberry betrachtet Bindungen, Peers, Überzeugungen und Delinquenz als wechselseitig verbunden. Schwache Bindungen können Delinquenz fördern. Delinquenz kann ihrerseits Bindungen schwächen und Zugang zu delinquenten Gruppen verändern."},{"t":"skript38","q":"Welche Aussage beschreibt „Karrieremodelle“ gemäß dem Lernskript am treffendsten?","a":["Die Theorie verbindet eine relativ stabile Neigung zu unmittelbarer Bedürfnisbefriedigung mit verfügbaren Gelegenheiten.","Akers ergänzt Definitionen und Kontakte um Nachahmung und differentielle Verstärkung.","Cloward und Ohlin ergänzen strukturell ungleiche legale Chancen um ungleichen Zugang zu illegalen Lern- und Erwerbsgelegenheiten.","Prozessmodelle betrachten wiederholte Delinquenz als Verlauf, in dem Verhalten, Sanktion, soziale Reaktionen und Gelegenheiten aufeinander folgen können."],"c":3,"e":"Prozessmodelle betrachten wiederholte Delinquenz als Verlauf, in dem Verhalten, Sanktion, soziale Reaktionen und Gelegenheiten aufeinander folgen können. Quensels und Hess’ Modelle setzen jeweils eigene Akzente bei der Verbindung von Handeln und gesellschaftlicher Reaktion."},{"t":"skript38","q":"Welcher Theorie ist folgende Kernaussage zuzuordnen? „Prozessmodelle betrachten wiederholte Delinquenz als Verlauf, in dem Verhalten, Sanktion, soziale Reaktionen und Gelegenheiten aufeinander folgen können.“","a":["Soziale Bindungstheorie","Karrieremodelle","Selbstkontrolltheorie","Seductions of Crime"],"c":1,"e":"Zuordnung: Karrieremodelle. Prozessmodelle betrachten wiederholte Delinquenz als Verlauf, in dem Verhalten, Sanktion, soziale Reaktionen und Gelegenheiten aufeinander folgen können. Quensels und Hess’ Modelle setzen jeweils eigene Akzente bei der Verbindung von Handeln und gesellschaftlicher Reaktion."},{"t":"skript39","q":"Welche Aussage beschreibt „Feministische Kriminologien“ gemäß dem Lernskript am treffendsten?","a":["Sykes und Matza beschreiben fünf Rechtfertigungen, die eine Norm situativ außer Kraft setzen können.","Sellin untersucht Konflikte zwischen Verhaltensnormen sozialer Gruppen und staatlich geltenden Normen.","Feministische Kriminologien untersuchen geschlechtlich strukturierte Macht, Kriminalisierung, Viktimisierung und institutionelle Reaktionen.","Agnew unterscheidet das Verfehlen positiv bewerteter Ziele, den Verlust positiver Reize und die Konfrontation mit negativen Reizen."],"c":2,"e":"Feministische Kriminologien untersuchen geschlechtlich strukturierte Macht, Kriminalisierung, Viktimisierung und institutionelle Reaktionen. Unterschiedliche Strömungen betonen etwa Arbeitsteilung, Gewaltverhältnisse oder das Zusammenwirken von Geschlecht mit weiteren Ungleichheiten."},{"t":"skript39","q":"Welcher Theorie ist folgende Kernaussage zuzuordnen? „Feministische Kriminologien untersuchen geschlechtlich strukturierte Macht, Kriminalisierung, Viktimisierung und institutionelle Reaktionen.“","a":["Feministische Kriminologien","General Strain Theory","Differentielle Assoziation","Halt Theorie oder Containment Theorie"],"c":0,"e":"Zuordnung: Feministische Kriminologien. Feministische Kriminologien untersuchen geschlechtlich strukturierte Macht, Kriminalisierung, Viktimisierung und institutionelle Reaktionen. Unterschiedliche Strömungen betonen etwa Arbeitsteilung, Gewaltverhältnisse oder das Zusammenwirken von Geschlecht mit weiteren Ungleichheiten."},{"t":"skript40","q":"Welche Aussage beschreibt „Power Control Theorie“ gemäß dem Lernskript am treffendsten?","a":["Anderson untersucht, wie in bestimmten marginalisierten urbanen Kontexten öffentlich gezeigter Respekt und die glaubhafte Bereitschaft zur Gegenwehr Schutz versprechen können.","Hagan und Kollegen verbinden Machtverhältnisse im Erwerbsleben mit geschlechtsspezifischer Kontrolle im Haushalt.","Lombroso deutete körperliche Merkmale als Ausdruck eines angeblichen evolutionären Rückfalls.","Matza beschreibt einen zeitweisen Zustand gelockerter Bindung an konventionelle Normen."],"c":1,"e":"Hagan und Kollegen verbinden Machtverhältnisse im Erwerbsleben mit geschlechtsspezifischer Kontrolle im Haushalt. Unterschiede in Beaufsichtigung und Freiräumen können Unterschiede in Risikoneigung und Delinquenz mit erklären."},{"t":"skript40","q":"Welcher Theorie ist folgende Kernaussage zuzuordnen? „Hagan und Kollegen verbinden Machtverhältnisse im Erwerbsleben mit geschlechtsspezifischer Kontrolle im Haushalt.“","a":["Kriminalanthropologie","Theorie des sozialen Lernens","Kontrollbalance Theorie","Power Control Theorie"],"c":3,"e":"Zuordnung: Power Control Theorie. Hagan und Kollegen verbinden Machtverhältnisse im Erwerbsleben mit geschlechtsspezifischer Kontrolle im Haushalt. Unterschiede in Beaufsichtigung und Freiräumen können Unterschiede in Risikoneigung und Delinquenz mit erklären."},{"t":"skript41","q":"Welche Aussage beschreibt „Cultural Criminology“ gemäß dem Lernskript am treffendsten?","a":["Cultural Criminology untersucht Bedeutungen von Kriminalität und Kontrolle, etwa Stil, Emotionen, Medienbilder und kulturelle Aushandlung.","Eysenck verbindet Persönlichkeitsdimensionen und Konditionierung.","Hirschi unterscheidet emotionale Bindung, Investitionen in konventionelle Ziele, Einbindung in konventionelle Aktivitäten und Glauben an die Geltung von Normen.","Shaw und McKay verbinden strukturelle Bedingungen wie Armut und häufige Fluktuation mit Schwierigkeiten, dauerhaft lokale Netzwerke und informelle Kontrolle aufzubauen."],"c":0,"e":"Cultural Criminology untersucht Bedeutungen von Kriminalität und Kontrolle, etwa Stil, Emotionen, Medienbilder und kulturelle Aushandlung. Sie verbindet das Erleben in Situationen mit öffentlicher Darstellung."},{"t":"skript41","q":"Welcher Theorie ist folgende Kernaussage zuzuordnen? „Cultural Criminology untersucht Bedeutungen von Kriminalität und Kontrolle, etwa Stil, Emotionen, Medienbilder und kulturelle Aushandlung.“","a":["Neutralisierungstechniken","Subkulturtheorie","Cultural Criminology","Persönlichkeitstheorie"],"c":2,"e":"Zuordnung: Cultural Criminology. Cultural Criminology untersucht Bedeutungen von Kriminalität und Kontrolle, etwa Stil, Emotionen, Medienbilder und kulturelle Aushandlung. Sie verbindet das Erleben in Situationen mit öffentlicher Darstellung."},{"t":"skript42","q":"Welche Aussage beschreibt „Mikrosoziologie der Gewalt“ gemäß dem Lernskript am treffendsten?","a":["Biosoziale Arbeiten untersuchen mögliche Wechselwirkungen etwa zwischen neuropsychologischer Entwicklung, Stressregulation und sozialem Umfeld.","Reckless unterscheidet innere und äußere Haltekräfte.","Sampson und Kollegen verbinden sozialen Zusammenhalt und Vertrauen mit geteilten Erwartungen, bei Problemen zum Wohl der Gemeinschaft einzugreifen.","Collins rückt die Dynamik der direkten Konfrontation in den Mittelpunkt."],"c":3,"e":"Collins rückt die Dynamik der direkten Konfrontation in den Mittelpunkt. Angst und Anspannung können gewaltbereite Personen hemmen. Die emotionale Dominanz einer Seite und die Dynamik einer Gruppe können die Situation verändern. Vorwärtspanik bezeichnet bei Collins eine besondere Eskalation nach aufgestauter Spannung."},{"t":"skript42","q":"Welcher Theorie ist folgende Kernaussage zuzuordnen? „Collins rückt die Dynamik der direkten Konfrontation in den Mittelpunkt.“","a":["Differentielle Gelegenheiten","Mikrosoziologie der Gewalt","Biosoziale Ansätze","Drift Theorie"],"c":1,"e":"Zuordnung: Mikrosoziologie der Gewalt. Collins rückt die Dynamik der direkten Konfrontation in den Mittelpunkt. Angst und Anspannung können gewaltbereite Personen hemmen. Die emotionale Dominanz einer Seite und die Dynamik einer Gruppe können die Situation verändern. Vorwärtspanik bezeichnet bei Collins eine besondere Eskalation nach aufgestauter Spannung."},{"t":"skript43","q":"Welche Aussage beschreibt „Theorie der sozialen Identität“ gemäß dem Lernskript am treffendsten?","a":["Tittle betrachtet das Verhältnis zwischen ausgeübter und erfahrener Kontrolle.","Der Ansatz vermutet eine Kette von sichtbarer Unordnung über Rückzug und schwächere informelle Kontrolle hin zu schwereren Delikten.","Kategorisierung und Identifikation machen die eigene Gruppe zu einem Teil des Selbstbilds.","Katz rekonstruiert, wie eine Tat aus Sicht der handelnden Person im Moment eine besondere emotionale oder moralische Bedeutung gewinnt."],"c":2,"e":"Kategorisierung und Identifikation machen die eigene Gruppe zu einem Teil des Selbstbilds. Der Vergleich mit relevanten Fremdgruppen kann das Bedürfnis nach positiver Abgrenzung verstärken. Welche Handlung daraus folgt, hängt von der Gruppennorm und der Situation ab."},{"t":"skript43","q":"Welcher Theorie ist folgende Kernaussage zuzuordnen? „Kategorisierung und Identifikation machen die eigene Gruppe zu einem Teil des Selbstbilds.“","a":["Theorie der sozialen Identität","Seductions of Crime","Soziale Bindungstheorie","Kulturkonflikttheorie"],"c":0,"e":"Zuordnung: Theorie der sozialen Identität. Kategorisierung und Identifikation machen die eigene Gruppe zu einem Teil des Selbstbilds. Der Vergleich mit relevanten Fremdgruppen kann das Bedürfnis nach positiver Abgrenzung verstärken. Welche Handlung daraus folgt, hängt von der Gruppennorm und der Situation ab."}]);
const KEY='krimilearn-v01';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state.ratings ||= {};state.results ||= [];state.mcRatings ||= {};state.mcHistory ||= [];let tab='home',filter='all',cardIndex=0,revealed=false,session=null,cardMode='free',mcIndex=0,mcSelected=null,mcChecked=false;const app=document.getElementById('app');function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function theoryName(id){return theories.find(t=>t.id===id)?.name||id}function nav(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();scrollTo(0,0)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>nav(b.dataset.tab));function stat(){let vals=Object.values(state.ratings);return{known:vals.filter(x=>x==='known').length,review:vals.filter(x=>x==='review').length,total:cards.length}}function home(){let s=stat();return `<section class="card"><span class="eyebrow">Willkommen zurück</span><h2>43 Theorien. Ein Lernziel: Verstehen.</h2><p>Arbeite die Lernkarten durch und prüfe dein Wissen mit Fragen zu Begriffen, Mechanismen und Fällen.</p><div class="flex"><button onclick="nav('cards')">Lernkarten öffnen</button><button class="secondary" onclick="nav('quiz')">Test starten</button></div></section><section class="card"><div class="row"><strong>Dein Lernstand</strong><span class="muted">${s.known} von ${s.total} sicher</span></div><div class="progress" style="margin:14px 0"><span style="width:${s.known/s.total*100}%"></span></div><p class="muted">${s.review} freie Karten zur Wiederholung · ${Object.values(state.mcRatings).filter(x=>x.correct).length}/${quiz.length} MC-Fragen zuletzt richtig · ${state.results.length} abgeschlossene Tests</p></section><section class="card"><span class="eyebrow">Alle Theorieprofile · Lernskript</span><h3>Enthaltene Theorien</h3>${theories.map(t=>`<p><strong>${esc(t.name)}</strong><br><span class="muted">${esc(t.authors)}</span></p>`).join('')}<p class="muted">Grundlage: hochgeladenes Lernskript mit 43 Theorieprofilen. Neue Fragen zur Zuordnung und zum Verständnis; vertiefende Fallaufgaben folgen.</p></section>`}function deck(){return cards.filter(c=>filter==='all'||(filter==='review' ? state.ratings[c.id]==='review':c.theory===filter))}function mcDeck(){return quiz.map((q,i)=>({...q,id:i})).filter(q=>filter==='all'||(filter==='review'?state.mcRatings[q.id]?.correct===false:q.t===filter))}
function setCardMode(mode){cardMode=mode;mcIndex=0;mcSelected=null;mcChecked=false;render()}
function mcPick(i){if(mcChecked)return;mcSelected=i;render()}
function mcCheck(){if(mcSelected===null||mcChecked)return;const q=mcDeck()[mcIndex];if(!q)return;const correct=mcSelected===q.c;state.mcRatings[q.id]={correct,attempts:(state.mcRatings[q.id]?.attempts||0)+1,date:new Date().toISOString()};state.mcHistory.push({id:q.id,correct,date:new Date().toISOString()});save();mcChecked=true;render()}
function mcNext(step){const d=mcDeck();if(!d.length)return;mcIndex=(mcIndex+step+d.length)%d.length;mcSelected=null;mcChecked=false;render()}
function mcCardsView(){const d=mcDeck();if(mcIndex>=d.length)mcIndex=0;const q=d[mcIndex];if(!q)return `<section class="card"><p>Keine Fragen vorhanden.</p></section>`;return `<section class="card"><div class="row"><span class="pill">${esc(theoryName(q.t))}</span><span class="muted">${mcIndex+1} / ${d.length}</span></div><div class="progress" style="margin:12px 0 20px"><span style="width:${(mcIndex+1)/d.length*100}%"></span></div><h2>${esc(q.q)}</h2><p class="muted">Wähle eine Antwort aus.</p>${q.a.map((a,i)=>`<button class="choice ${mcSelected===i?'selected':''} ${mcChecked&&i===q.c?'correct':''} ${mcChecked&&mcSelected===i&&i!==q.c?'wrong':''}" onclick="mcPick(${i})" ${mcChecked?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}${mcChecked?`<div class="feedback ${mcSelected===q.c?'':'warning'}"><strong>${mcSelected===q.c?'Richtig!':'Noch nicht richtig.'}</strong><p>${esc(q.e)}</p><p class="small">Richtige Antwort: ${esc(q.a[q.c])}</p></div><button style="width:100%;margin-top:14px" onclick="mcNext(1)">Nächste Frage →</button>`:`<button style="width:100%;margin-top:14px" onclick="mcCheck()" ${mcSelected===null?'disabled':''}>Antwort prüfen</button>`}<div class="flex" style="margin-top:10px"><button class="ghost" onclick="mcNext(-1)">← Vorherige</button><button class="ghost" onclick="mcNext(1)">Überspringen →</button></div></section>`}
function cardsView(){let d=deck();if(cardIndex>=d.length)cardIndex=0;let c=d[cardIndex];return `<section class="card"><span class="eyebrow">Lernkarten · ${d.length} Karten</span><h2>Wiederholen und verstehen</h2><div class="flex" style="margin:12px 0"><button class="${cardMode==='free'?'':'secondary'}" onclick="setCardMode('free')">Freie Antwort</button><button class="${cardMode==='mc'?'':'secondary'}" onclick="setCardMode('mc')">Multiple Choice</button></div><label class="muted" for="filter">Auswahl</label><select id="filter" onchange="setFilter(this.value)"><option value="all" ${filter==='all'?'selected':''}>Alle Theorien</option><option value="review" ${filter==='review'?'selected':''}>Nur unsichere Karten / Fragen</option>${theories.map(t=>`<option value="${t.id}" ${filter===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></section>${cardMode==='mc'?mcCardsView():!c?`<section class="card"><h3>Keine Karten in dieser Auswahl</h3><p>Markiere Karten mit „Noch üben“, um sie hier gezielt zu wiederholen.</p><button onclick="setFilter('all')">Alle Karten anzeigen</button></section>`:`<section class="card"><div class="row"><span class="pill">${esc(theoryName(c.theory))}</span><span class="muted">${cardIndex+1} / ${d.length}</span></div><div class="progress" style="margin:12px 0 20px"><span style="width:${(cardIndex+1)/d.length*100}%"></span></div><div class="flash" onclick="flip()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flip()}"><span class="eyebrow">${revealed?'Antwort':'Frage'}</span><h3 class="${revealed?'answer':''}">${esc(revealed?c.back:c.front)}</h3><span class="muted small">${revealed?'Tippen, um die Frage erneut zu sehen':'Antippen, um die Antwort aufzudecken'}</span></div><div class="flex" style="margin-top:17px">${revealed?`<button class="secondary" onclick="rate('review')">↻ Noch üben</button><button onclick="rate('known')">✓ Gewusst</button>`:`<button class="secondary" onclick="nextCard(-1)">← Zurück</button><button onclick="flip()">Antwort zeigen</button>`}</div><div class="flex" style="margin-top:9px"><button class="ghost" onclick="nextCard(-1)">← Vorherige</button><button class="ghost" onclick="nextCard(1)">Nächste →</button></div></section>`}`}function setFilter(v){filter=v;cardIndex=0;mcIndex=0;mcSelected=null;mcChecked=false;revealed=false;render()}function flip(){revealed=!revealed;render()}function nextCard(step){let d=deck();if(!d.length)return;cardIndex=(cardIndex+step+d.length)%d.length;revealed=false;render()}function rate(r){let c=deck()[cardIndex];if(!c)return;state.ratings[c.id]=r;save();nextCard(1)}function startQuiz(){let items=quiz.map((q,i)=>({...q,id:i}));for(let i=items.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}session={items:items.slice(0,10),pos:0,selected:null,checked:false,correct:0,answers:[]};render()}function pick(i){if(session.checked)return;session.selected=i;render()}function check(){if(session.selected===null)return;let q=session.items[session.pos];session.checked=true;if(session.selected===q.c)session.correct++;session.answers.push({id:q.id,correct:session.selected===q.c});render()}function advance(){if(session.pos===session.items.length-1){state.results.push({date:new Date().toISOString(),score:session.correct,total:session.items.length,answers:session.answers});save();session.done=true}else{session.pos++;session.selected=null;session.checked=false}render()}function quizView(){if(!session)return `<section class="card"><span class="eyebrow">Wissenstest</span><h2>Wie sicher sitzt dein Wissen?</h2><p>10 zufällig ausgewählte Fragen aus einem Pool von ${quiz.length} Aufgaben. Du erhältst nach jeder Antwort eine Erklärung.</p><p class="muted">Die Fragen enthalten Wissen, Verständnis und kurze Anwendungsfälle. Jede richtige Antwort zählt einen Punkt.</p><button onclick="startQuiz()">Test beginnen →</button></section>`;if(session.done)return `<section class="card"><span class="eyebrow">Test abgeschlossen</span><h2>Dein Ergebnis</h2><div class="big">${session.correct} / ${session.items.length}</div><p>${session.correct>=8?'Sehr gutes Ergebnis!':session.correct>=6?'Gute Grundlage – wiederhole noch einige Inhalte.':'Nutze die Lernkarten, um Wissenslücken gezielt zu schließen.'}</p><p class="muted">${Math.round(session.correct/session.items.length*100)} % richtig · Ergebnis lokal gespeichert</p><div class="flex"><button onclick="startQuiz()">Neuer Test</button><button class="secondary" onclick="nav('stats')">Auswertung</button></div></section>`;let q=session.items[session.pos];return `<section class="card"><div class="row"><span class="eyebrow">Frage ${session.pos+1} von ${session.items.length}</span><span class="pill">${esc(theoryName(q.t))}</span></div><div class="progress" style="margin:15px 0"><span style="width:${(session.pos+1)/session.items.length*100}%"></span></div><h2>${esc(q.q)}</h2>${q.a.map((a,i)=>`<button class="choice ${session.selected===i?'selected':''} ${session.checked&&i===q.c?'correct':''} ${session.checked&&session.selected===i&&i!==q.c?'wrong':''}" onclick="pick(${i})" ${session.checked?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(a)}</button>`).join('')}${session.checked?`<div class="feedback ${session.selected===q.c?'':'warning'}"><strong>${session.selected===q.c?'Richtig!':'Noch nicht richtig.'}</strong><p>${esc(q.e)}</p></div><button style="width:100%;margin-top:14px" onclick="advance()">${session.pos===session.items.length-1?'Ergebnis anzeigen':'Nächste Frage →'}</button>`:`<button style="width:100%;margin-top:14px" onclick="check()" ${session.selected===null?'disabled':''}>Antwort prüfen</button>`}</section>`}function statsView(){let s=stat(),last=state.results.slice(-5).reverse(),mc=Object.values(state.mcRatings),mcKnown=mc.filter(x=>x.correct).length,mcWrong=mc.filter(x=>!x.correct).length;return `<section class="card"><span class="eyebrow">Lernfortschritt</span><h2>Deine Übersicht</h2><div class="big">${s.known} <span class="muted" style="font-size:17px">/ ${s.total} Karten sicher</span></div><div class="progress" style="margin:14px 0"><span style="width:${s.known/s.total*100}%"></span></div><p>${s.review} Karten als unsicher markiert</p><div class="divider"></div><details><summary><strong>Fortschritt nach Theorie anzeigen</strong></summary>${theories.map(t=>{let d=cards.filter(c=>c.theory===t.id),k=d.filter(c=>state.ratings[c.id]==='known').length;return `<p><strong>${esc(t.name)}</strong> <span class="muted">${k}/${d.length}</span></p><div class="progress"><span style="width:${k/d.length*100}%"></span></div>`}).join('')}</details></section><section class="card"><h3>Multiple-Choice-Lernkarten</h3><div class="big">${mcKnown} <span class="muted" style="font-size:17px">/ ${quiz.length} zuletzt richtig</span></div><div class="progress" style="margin:14px 0"><span style="width:${mcKnown/quiz.length*100}%"></span></div><p>${mcWrong} Fragen zur Wiederholung · ${state.mcHistory.length} beantwortete MC-Fragen insgesamt</p><p class="muted">Bewertet wird pro Frage die zuletzt geprüfte Antwort. Unter „Lernkarten → Multiple Choice → Nur unsichere Karten“ kannst du falsch beantwortete Fragen erneut üben.</p></section><section class="card"><h3>Letzte Tests</h3>${last.length?last.map(r=>`<p><strong>${r.score}/${r.total} Punkte</strong> <span class="muted">· ${new Date(r.date).toLocaleDateString('de-DE')}</span></p>`).join(''):'<p class="muted">Noch kein Test abgeschlossen.</p>'}<div class="divider"></div><p class="muted">Die Daten liegen ausschließlich im lokalen Speicher dieses Browsers. Bei Löschung der Websitedaten können sie verloren gehen.</p><div class="flex"><button class="secondary" onclick="exportData()">Fortschritt sichern</button><button class="ghost" onclick="importData()">Sicherung laden</button></div><input class="hidden" type="file" id="importFile" accept="application/json,.json" onchange="readImport(this)"><p><button class="ghost" onclick="resetData()">Lernstand zurücksetzen</button></p></section>`}function exportData(){let blob=new Blob([JSON.stringify({version:1,data:state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='krimilearn-lernstand.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(){document.getElementById('importFile').click()}function readImport(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);if(o.version!==1||!o.data||typeof o.data.ratings!=='object'||!Array.isArray(o.data.results))throw Error();if(confirm('Vorhandenen Lernstand durch diese Sicherung ersetzen?')){state={ratings:o.data.ratings,results:o.data.results,mcRatings:o.data.mcRatings||{},mcHistory:o.data.mcHistory||[]};save();render()}}catch{alert('Diese Sicherungsdatei konnte nicht gelesen werden.')}};r.readAsText(f)}function resetData(){if(confirm('Alle Kartenbewertungen und Testergebnisse auf diesem Gerät löschen?')){state={ratings:{},results:[],mcRatings:{},mcHistory:[]};save();render()}}function render(){app.innerHTML=tab==='home'?home():tab==='cards'?cardsView():tab==='quiz'?quizView():statsView()}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script><footer>KrimiLearn 0.3 · Grundlage: Lernskript Kriminalitätstheorien · Zusätzliche Lernfragen</footer></body></html>
